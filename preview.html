    <script type="module">
import * as THREE from 'three';
import { Reflector } from 'three/addons/objects/Reflector.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

// ===== world/config.js =====
// Magical Winter Forest Ice Rink — layout & look constants.
// Tweak values here to rebalance the scene without touching the builders.

const RINK = {
  // Capsule rink (2026-11-02): length exactly 2 × width, two half-circle ends joined by straight sides.
  // Same ice area as the 60 × 42 ellipse it replaced: π·60·42 = (4 + π)·R²  →  R ≈ 33.3 m.
  radius: 33.3, // half-width (z) = radius of the round ends
  half: 33.3,   // half-length of the straight middle (x) — total length 2·(half + radius) = 4·radius
  rx: 66.6,     // overall half-length (x)
  rz: 33.3,     // overall half-width  (z)
  iceY: 0.03,
  boardHeight: 0.9,
  boardThickness: 0.35,
};

const ISLAND_RADIUS = 6.2; // snow island under the central tree

// ---- capsule rink geometry helpers (used by ice, boards, lights, snow, movement limits) ----
// signed distance to the ice outline: < 0 inside, 0 on the boards' inner face, > 0 outside
function rinkDist(x, z) { return Math.hypot(Math.max(Math.abs(x) - RINK.half, 0), z) - RINK.radius; }
// outward unit normal of the outline nearest to (x, z)
function rinkNormal(x, z) {
  const qx = Math.sign(x) * Math.max(Math.abs(x) - RINK.half, 0), l = Math.hypot(qx, z);
  return l > 1e-6 ? { x: qx / l, z: z / l } : { x: 0, z: z >= 0 ? 1 : -1 };
}
// capsule outline as a THREE.Shape / Path, pushed out by `grow`
function rinkShape(grow = 0, Kind = THREE.Shape) {
  const s = new Kind(), r = RINK.radius + grow, h = RINK.half;
  s.absarc(h, 0, r, -Math.PI / 2, Math.PI / 2, false);
  s.absarc(-h, 0, r, Math.PI / 2, (3 * Math.PI) / 2, false);
  s.closePath();
  return s;
}
// point on the outline (pushed out by `offset`) at arc-length fraction u ∈ [0, 1), with outward normal + tangent
function rinkPerimeterPoint(u, offset = 0) {
  const r = RINK.radius, h = RINK.half, P = 4 * h + 2 * Math.PI * r;
  let L = (((u % 1) + 1) % 1) * P;
  let x, z, nx, nz;
  if (L < 2 * h) { x = h - L; z = r; nx = 0; nz = 1; }
  else if ((L -= 2 * h) < Math.PI * r) { const a = Math.PI / 2 + L / r; nx = Math.cos(a); nz = Math.sin(a); x = -h + r * nx; z = r * nz; }
  else if ((L -= Math.PI * r) < 2 * h) { x = -h + L; z = -r; nx = 0; nz = -1; }
  else { L -= 2 * h; const a = -Math.PI / 2 + L / r; nx = Math.cos(a); nz = Math.sin(a); x = h + r * nx; z = r * nz; }
  return { x: x + nx * offset, z: z + nz * offset, nx, nz, tx: -nz, tz: nx };
}
// point on the outline (pushed out by `offset`) in direction `theta` from the centre, with outward normal
function rinkEdgePoint(theta, offset = 0) {
  const c = Math.cos(theta), s = Math.sin(theta);
  let lo = 0, hi = 400;
  for (let i = 0; i < 48; i++) { const m = (lo + hi) / 2; if (rinkDist(m * c, m * s) < offset) lo = m; else hi = m; }
  const n = rinkNormal(lo * c, lo * s);
  return { x: lo * c, z: lo * s, nx: n.x, nz: n.z };
}

const CENTER_TREE = {
  height: 19,
  radius: 6.4,
  tiers: 8,
  bulbs: 1700,
};

const FOREST = {
  count: 22, // + 1 central tree = 23 trees total (limit 20~25)
  seed: 2026,
  frontGapDeg: [62, 118], // keep the arc in front of the camera open
};

const PALETTE = {
  skyTop: 0x010207,
  skyHorizon: 0x070f1f,
  skyBottom: 0x060c1a,
  fog: 0x060c1a,
  fogDensity: 0.00525, // halved with the 2× rink so the far side looks as it did before
  snow: 0xd8e2f0,
  foliage: 0x0d2618,
  foliageCenter: 0x0f2a1a,
  trunk: 0x2a1a10,
  boards: 0xcfd9e6,
  iceDeep: 0x041224,
  iceFrost: 0x3a5878,
  // warm bulb colour in linear RGB (values > 1 feed the bloom pass)
  bulbA: [1.0, 0.42, 0.1],
  bulbB: [1.0, 0.6, 0.22],
  warmLight: 0xff8c42,
};

const LIGHTING = {
  exposure: 1.05,
  // light intensities below: 2026-11-02 night setup × 1.2 (user: "20% brighter")
  hemi: { sky: 0x1f2a48, ground: 0x2a2028, intensity: 0.72 },    // low, deep-navy night ambient (warm-dark bounce)
  // soft cream/amber front fill on the skater only, so the face reads anywhere on the rink
  characterFill: { color: 0xffc58e, intensity: 0.66, boost: 2.05 },   // boost: all light on the skater only (≈ +50% on screen)   // very faint warm amber front fill — just keeps the face out of the dark
  moon: { color: 0x9fb4e0, intensity: 0.36 },
  treeRing: { count: 3, radius: 9, y: 7, intensity: 36, distance: 55, decay: 1.5 },   // raised above skater height (no hot spot when skating past)
  treeTop: { y: 14, z: 7, intensity: 26.4, distance: 30, decay: 1.7 },
  forest: { anglesDeg: [200, 270, 340], offset: 8, y: 4.5, intensity: 36, distance: 35, decay: 1.7 },
  // low amber pools just outside the boards, all the way round (the glow of the rail string lights)
  rail: { count: 8, offset: 3, y: 2.6, intensity: 12, distance: 34, decay: 1.4, color: 0xff9a4a },
  bloom: { strength: 0.85, radius: 0.55, threshold: 0.82 },
  bulbIntensity: [2.6, 4.2],
};

// Direction to the (small, faint) moon. Also used for the cool key light.
const MOON_DIR = [-0.42, 0.24, -0.88];

// The final pass applies ACES Filmic tone mapping (with LIGHTING.exposure). To make a surface show up
// on screen with exactly a colour picked from the reference background image, feed the inverse here.
// GLSL twin of this lives in world/backdrop.js.
const ACES_IN = new THREE.Matrix3().set(0.59719, 0.35458, 0.04823, 0.076, 0.90834, 0.01566, 0.0284, 0.13383, 0.83777);
const ACES_OUT = new THREE.Matrix3().set(1.60475, -0.53108, -0.07367, -0.10208, 1.10813, -0.00605, -0.00327, -0.07276, 1.07602);
function sceneColorForDisplay(hex) {
  const c = new THREE.Color(hex);                                    // linear display target
  const y = new THREE.Vector3(c.r, c.g, c.b).applyMatrix3(ACES_OUT.clone().invert());
  const v = y.toArray().map((t) => {
    t = Math.min(0.97, Math.max(0, t));
    const A = 1 - 0.983729 * t, B = 0.0245786 - 0.432951 * t, Cc = -(0.000090537 + 0.238081 * t);
    return (-B + Math.sqrt(B * B - 4 * A * Cc)) / (2 * A);
  });
  const x = new THREE.Vector3(...v).applyMatrix3(ACES_IN.clone().invert()).multiplyScalar(0.6 / LIGHTING.exposure);
  return new THREE.Color().setRGB(Math.max(0, x.x), Math.max(0, x.y), Math.max(0, x.z), THREE.LinearSRGBColorSpace);
}

function mulberry32(seed) {
  let a = seed >>> 0;
  return function () {
    a = (a + 0x6d2b79f5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

// ===== world/warmGlow.js =====

// Cheap "bulb bounce" light: instead of giving every bulb a real light,
// standard materials get a few soft warm spheres of emissive glow injected
// via onBeforeCompile. Snow (white) catches it strongly, dark needles barely.

const MAX_GLOW_POINTS = 32;

function createWarmGlow(color = new THREE.Color(1.0, 0.42, 0.12)) {
  const points = Array.from({ length: MAX_GLOW_POINTS }, () => new THREE.Vector4(0, -9999, 0, 1));
  const strengths = new Array(MAX_GLOW_POINTS).fill(0);
  const shared = {
    uGlowPoints: { value: points },
    uGlowStrength: { value: strengths },
    uGlowCount: { value: 0 },
    uGlowColor: { value: color },
    uGlowFlicker: { value: 1 },
  };

  function add(x, y, z, radius, strength = 1) {
    const i = shared.uGlowCount.value;
    if (i >= MAX_GLOW_POINTS) return;
    points[i].set(x, y, z, radius);
    strengths[i] = strength;
    shared.uGlowCount.value = i + 1;
  }

  function patch(material, gain = 1) {
    const local = { uGlowGain: { value: gain } };
    material.onBeforeCompile = (shader) => {
      Object.assign(shader.uniforms, shared, local);
      shader.vertexShader =
        'varying vec3 vWarmWorld;\n' +
        shader.vertexShader.replace(
          '#include <project_vertex>',
          `#include <project_vertex>
          vec4 wgP = vec4( transformed, 1.0 );
          #ifdef USE_INSTANCING
            wgP = instanceMatrix * wgP;
          #endif
          vWarmWorld = ( modelMatrix * wgP ).xyz;`
        );
      shader.fragmentShader =
        `#define WG_MAX ${MAX_GLOW_POINTS}
        uniform vec4 uGlowPoints[WG_MAX];
        uniform float uGlowStrength[WG_MAX];
        uniform int uGlowCount;
        uniform vec3 uGlowColor;
        uniform float uGlowGain;
        uniform float uGlowFlicker;
        varying vec3 vWarmWorld;\n` +
        shader.fragmentShader.replace(
          '#include <emissivemap_fragment>',
          `#include <emissivemap_fragment>
          float wgSum = 0.0;
          for ( int i = 0; i < WG_MAX; i ++ ) {
            if ( i >= uGlowCount ) break;
            vec3 wgD = vWarmWorld - uGlowPoints[ i ].xyz;
            float wgR = uGlowPoints[ i ].w;
            wgSum += uGlowStrength[ i ] * exp( - dot( wgD, wgD ) / ( wgR * wgR ) );
          }
          totalEmissiveRadiance += uGlowColor * diffuseColor.rgb * wgSum * uGlowGain * uGlowFlicker;`
        );
    };
    material.customProgramCacheKey = () => 'warm-glow';
    return material;
  }

  return { add, patch, uniforms: shared };
}

// ===== world/bulbs.js =====

// Every string-light bulb in the scene (tree, forest, rink rail) lives in ONE
// THREE.Points draw call. Bulbs are HDR-bright sprites (> 1.0) so the bloom
// pass makes them glow; no per-bulb real-time lights.

const vertexShader = /* glsl */ `
  uniform float uTime;
  uniform float uViewportH;
  attribute vec3 aColor;
  attribute float aSize;
  attribute float aPhase;
  varying vec3 vColor;
  varying float vTw;
  void main() {
    vec4 mv = modelViewMatrix * vec4( position, 1.0 );
    gl_Position = projectionMatrix * mv;
    float dist = max( - mv.z, 0.1 );
    float px = aSize * uViewportH * projectionMatrix[ 1 ][ 1 ] * 0.5 / dist;
    gl_PointSize = clamp( px, 1.5, 48.0 );
    float speed = 0.8 + fract( aPhase * 13.37 ) * 2.2;
    vTw = 0.78 + 0.22 * sin( uTime * speed + aPhase * 6.2831 );
    vTw *= clamp( px / 1.5, 0.35, 1.0 );          // fade sub-pixel bulbs instead of shimmering
    vTw *= exp( - pow( dist * 0.006, 2.0 ) );     // gentle atmospheric falloff
    vColor = aColor;
  }
`;

const fragmentShader = /* glsl */ `
  varying vec3 vColor;
  varying float vTw;
  void main() {
    vec2 c = gl_PointCoord - 0.5;
    float r2 = dot( c, c ) * 4.0;
    if ( r2 > 1.0 ) discard;
    float core = exp( - r2 * 14.0 );
    float halo = exp( - r2 * 3.5 ) * 0.35;
    vec3 col = vColor * ( core + halo ) * vTw;
    col += vec3( 1.0, 0.86, 0.62 ) * core * vTw * 0.9;  // hot filament centre
    gl_FragColor = vec4( col, 1.0 );
  }
`;

class BulbField {
  constructor() {
    this.positions = [];
    this.colors = [];
    this.sizes = [];
    this.phases = [];
    this.material = null;
  }

  add(x, y, z, size, r, g, b) {
    this.positions.push(x, y, z);
    this.colors.push(r, g, b);
    this.sizes.push(size);
    this.phases.push(Math.random());
  }

  get count() {
    return this.sizes.length;
  }

  build() {
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.Float32BufferAttribute(this.positions, 3));
    geo.setAttribute('aColor', new THREE.Float32BufferAttribute(this.colors, 3));
    geo.setAttribute('aSize', new THREE.Float32BufferAttribute(this.sizes, 1));
    geo.setAttribute('aPhase', new THREE.Float32BufferAttribute(this.phases, 1));
    geo.computeBoundingSphere();

    this.material = new THREE.ShaderMaterial({
      uniforms: { uTime: { value: 0 }, uViewportH: { value: 1080 } },
      vertexShader,
      fragmentShader,
      transparent: true,
      depthWrite: false,
      blending: THREE.AdditiveBlending,
      fog: false,
    });
    const points = new THREE.Points(geo, this.material);
    points.name = 'StringLights';
    points.frustumCulled = false;
    return points;
  }
}

// Helper: a warm bulb colour with slight per-bulb variation (linear HDR).
function warmBulbColor(rng, palette, intensityRange) {
  const t = rng();
  const k = intensityRange[0] + rng() * (intensityRange[1] - intensityRange[0]);
  const [a, b] = [palette.bulbA, palette.bulbB];
  return [
    (a[0] + (b[0] - a[0]) * t) * k,
    (a[1] + (b[1] - a[1]) * t) * k,
    (a[2] + (b[2] - a[2]) * t) * k,
  ];
}

// ===== world/sky.js =====


// Near-black navy dome, a sparse handful of dim stars and a small faint moon.
// No city glow, no buildings.

function createSky({ radius = 450 } = {}) {
  const group = new THREE.Group();
  group.name = 'NightSky';

  const dome = new THREE.Mesh(
    new THREE.SphereGeometry(radius, 32, 16),
    new THREE.ShaderMaterial({
      side: THREE.BackSide,
      depthWrite: false,
      fog: false,
      uniforms: {
        uTop: { value: new THREE.Color(PALETTE.skyTop) },
        uHorizon: { value: new THREE.Color(PALETTE.skyHorizon) },
        uBottom: { value: new THREE.Color(PALETTE.skyBottom) },
      },
      vertexShader: /* glsl */ `
        varying vec3 vDir;
        void main() {
          vDir = normalize( position );
          gl_Position = projectionMatrix * modelViewMatrix * vec4( position, 1.0 );
        }`,
      fragmentShader: /* glsl */ `
        uniform vec3 uTop; uniform vec3 uHorizon; uniform vec3 uBottom;
        varying vec3 vDir;
        void main() {
          float h = normalize( vDir ).y;
          vec3 col = mix( uHorizon, uTop, smoothstep( 0.0, 0.55, h ) );
          col = mix( col, uBottom, smoothstep( 0.0, -0.15, h ) );
          float n = fract( sin( dot( gl_FragCoord.xy, vec2( 12.9898, 78.233 ) ) ) * 43758.5453 );
          col += ( n - 0.5 ) * 0.0015; // dither to avoid banding in the dark gradient
          gl_FragColor = vec4( col, 1.0 );
        }`,
    })
  );
  dome.renderOrder = -10;
  group.add(dome);

  // --- sparse stars ---------------------------------------------------------
  const rng = mulberry32(77);
  const STAR_COUNT = 160;
  const pos = [], size = [], phase = [], bright = [];
  const r = radius * 0.92;
  while (size.length < STAR_COUNT) {
    const u = rng() * 2 - 1, th = rng() * Math.PI * 2;
    const s = Math.sqrt(1 - u * u);
    const d = [s * Math.cos(th), u, s * Math.sin(th)];
    if (d[1] < 0.14) continue; // only above the treeline
    pos.push(d[0] * r, d[1] * r, d[2] * r);
    size.push(1.0 + rng() * 1.4);
    phase.push(rng());
    bright.push(0.12 + Math.pow(rng(), 3) * 0.45);
  }
  const starGeo = new THREE.BufferGeometry();
  starGeo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  starGeo.setAttribute('aSize', new THREE.Float32BufferAttribute(size, 1));
  starGeo.setAttribute('aPhase', new THREE.Float32BufferAttribute(phase, 1));
  starGeo.setAttribute('aBright', new THREE.Float32BufferAttribute(bright, 1));
  const starMat = new THREE.ShaderMaterial({
    uniforms: { uTime: { value: 0 }, uPixelRatio: { value: 1 } },
    transparent: true,
    depthWrite: false,
    blending: THREE.AdditiveBlending,
    fog: false,
    vertexShader: /* glsl */ `
      uniform float uTime; uniform float uPixelRatio;
      attribute float aSize; attribute float aPhase; attribute float aBright;
      varying float vB;
      void main() {
        gl_Position = projectionMatrix * modelViewMatrix * vec4( position, 1.0 );
        gl_PointSize = aSize * uPixelRatio;
        vB = aBright * ( 0.75 + 0.25 * sin( uTime * ( 0.5 + aPhase ) + aPhase * 20.0 ) );
      }`,
    fragmentShader: /* glsl */ `
      varying float vB;
      void main() {
        float r = length( gl_PointCoord - 0.5 ) * 2.0;
        float a = smoothstep( 1.0, 0.0, r );
        gl_FragColor = vec4( vec3( 0.75, 0.82, 1.0 ) * vB, a );
      }`,
  });
  const stars = new THREE.Points(starGeo, starMat);
  stars.frustumCulled = false;
  group.add(stars);

  // --- small faint moon -----------------------------------------------------
  const moonDir = new THREE.Vector3(...MOON_DIR).normalize();
  const moon = new THREE.Mesh(
    new THREE.PlaneGeometry(1, 1),
    new THREE.ShaderMaterial({
      transparent: true,
      depthWrite: false,
      blending: THREE.AdditiveBlending,
      fog: false,
      vertexShader: /* glsl */ `
        varying vec2 vUv;
        void main() { vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4( position, 1.0 ); }`,
      fragmentShader: /* glsl */ `
        varying vec2 vUv;
        void main() {
          float r = length( vUv - 0.5 ) * 2.0;
          float disc = smoothstep( 0.2, 0.18, r );
          float halo = exp( - r * 5.0 ) * 0.12;
          vec3 col = vec3( 0.52, 0.58, 0.7 ) * disc * 0.55 + vec3( 0.25, 0.32, 0.5 ) * halo;
          gl_FragColor = vec4( col, 1.0 );
        }`,
    })
  );
  moon.position.copy(moonDir).multiplyScalar(radius * 0.85);
  moon.scale.setScalar(34);
  moon.lookAt(0, 0, 0);
  group.add(moon);

  return {
    group,
    moonDir,
    update(t) {
      starMat.uniforms.uTime.value = t;
    },
    setPixelRatio(pr) {
      starMat.uniforms.uPixelRatio.value = pr;
    },
  };
}

// ===== world/backdrop.js =====
// Background = the reference night image itself (starry navy sky over a distant city skyline).
// It is not a 360° panorama, so it is laid on a tall open cylinder far outside the rink and repeated
// 4× around it, every other copy mirrored so the edges always meet seamlessly. The copy straight ahead
// of the opening camera view is un-mirrored. No fog (it is already far away), colours are pre-inverted
// against the output tone mapping so the image shows on screen as in the original.

function createBackdrop({ radius = 250, copies = 4, imageBottom = 3.0, skirt = 6.0, imageAspect = 2172 / 724 } = {}) {
  const imgH = (2 * Math.PI * radius) / copies / imageAspect;     // world height of one image copy
  const H = skirt + imgH;
  const tex = new THREE.TextureLoader().load(BACKDROP_JPG);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.generateMipmaps = true;
  tex.minFilter = THREE.LinearMipmapLinearFilter;
  tex.anisotropy = 8;
  const mat = new THREE.ShaderMaterial({
    side: THREE.BackSide,
    transparent: true,
    depthWrite: false,
    fog: false,
    toneMapped: false,
    uniforms: {
      tMap: { value: tex },
      uCopies: { value: copies },
      uSkirt: { value: skirt / H },
      uExposure: { value: LIGHTING.exposure },
    },
    vertexShader: /* glsl */ `
      varying vec2 vUv;
      void main() { vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4( position, 1.0 ); }`,
    fragmentShader: /* glsl */ `
      uniform sampler2D tMap; uniform float uCopies; uniform float uSkirt; uniform float uExposure;
      varying vec2 vUv;
      // inverse of the final ACES Filmic pass (see sceneColorForDisplay)
      const mat3 IN = mat3( vec3( 0.59719, 0.07600, 0.02840 ), vec3( 0.35458, 0.90834, 0.13383 ), vec3( 0.04823, 0.01566, 0.83777 ) );
      const mat3 OUT = mat3( vec3( 1.60475, -0.10208, -0.00327 ), vec3( -0.53108, 1.10813, -0.07276 ), vec3( -0.07367, -0.00605, 1.07602 ) );
      vec3 invRRT( vec3 t ) {
        t = clamp( t, 0.0, 0.93 );
        vec3 A = 1.0 - 0.983729 * t, B = 0.0245786 - 0.432951 * t, C = -( 0.000090537 + 0.238081 * t );
        return ( -B + sqrt( B * B - 4.0 * A * C ) ) / ( 2.0 * A );
      }
      void main() {
        float k = vUv.x * uCopies + 0.5;                       // copy index / position inside the copy
        float f = fract( k );
        if ( mod( floor( k ), 2.0 ) < 0.5 ) f = 1.0 - f;       // seen from inside: un-mirrored for even copies
        float v = clamp( ( vUv.y - uSkirt ) / ( 1.0 - uSkirt ), 0.002, 0.998 );
        float skirt = 1.0 - step( uSkirt, vUv.y );
        vec3 disp = texture2D( tMap, vec2( f, v ), skirt * 5.0 ).rgb;   // linear display colour wanted on screen
        vec3 col = max( inverse( IN ) * invRRT( inverse( OUT ) * disp ), 0.0 ) * 0.6 / uExposure;
        float a = 1.0 - smoothstep( 0.72, 0.99, v );           // melt into the sky dome at the top
        gl_FragColor = vec4( col, a );
      }`,
  });
  const geo = new THREE.CylinderGeometry(radius, radius, H, 512, 1, true);
  const band = new THREE.Mesh(geo, mat);
  band.position.y = imageBottom - skirt + H / 2;
  band.renderOrder = -5;
  band.frustumCulled = false;
  band.name = 'BackdropImage';
  return { mesh: band };
}

// ===== world/firTree.js =====

// Low-poly snow-laden fir built from stacked cones. Geometries are unit-sized
// and shared; each tier is one instance in an InstancedMesh, so the whole
// forest costs only a few draw calls.

const SEGMENTS = 14;

/** Foliage tier: unit cone, base at y=0, jagged drooping lower edge. */
function createFoliageGeometry() {
  const g = new THREE.ConeGeometry(1, 1, SEGMENTS, 2, false);
  g.translate(0, 0.5, 0);
  const p = g.attributes.position;
  for (let i = 0; i < p.count; i++) {
    const x = p.getX(i), y = p.getY(i), z = p.getZ(i);
    const rad = Math.hypot(x, z);
    if (rad < 1e-4) continue;
    const a = Math.atan2(z, x);
    // ConeGeometry places segment j at theta = j/SEGMENTS·2π with x = sin, z = cos
    let theta = Math.atan2(x, z);
    if (theta < 0) theta += Math.PI * 2;
    const k = (Math.round((theta / (Math.PI * 2)) * SEGMENTS) % SEGMENTS) % 2;
    if (y < 0.01) {
      const s = k ? 1.0 : 0.8;
      p.setXYZ(i, x * s, k ? -0.06 : 0.05, z * s);
    } else if (y < 0.9) {
      const s = 1 + 0.05 * Math.sin(a * 5.0);
      p.setXYZ(i, x * s, y, z * s);
    }
  }
  g.computeVertexNormals();
  return g;
}

/** Snow cap: unit cone with a soft wavy, drooping rim. */
function createSnowCapGeometry() {
  const g = new THREE.ConeGeometry(1, 1, SEGMENTS, 1, false);
  g.translate(0, 0.5, 0);
  const p = g.attributes.position;
  for (let i = 0; i < p.count; i++) {
    const x = p.getX(i), y = p.getY(i), z = p.getZ(i);
    if (y > 0.01 || Math.hypot(x, z) < 1e-4) continue;
    const a = Math.atan2(z, x);
    const s = 1 + 0.06 * Math.sin(a * 7 + 1);
    p.setXYZ(i, x * s, 0.08 * Math.sin(a * 7) - 0.05, z * s);
  }
  g.computeVertexNormals();
  return g;
}

function createTrunkGeometry() {
  const g = new THREE.CylinderGeometry(0.55, 0.75, 1, 8, 1, true);
  g.translate(0, 0.5, 0);
  return g;
}

/**
 * Describe a fir as tiers. Returns tiers (foliage) + caps (snow) in local
 * space (base at y=0) and an envelope(y) radius function used to wrap lights.
 */
function describeFir({ height, radius, tiers, capCover = 0.58 }) {
  const trunkH = height * 0.1;
  const span = height - trunkH;
  const list = [];
  const caps = [];
  for (let i = 0; i < tiers; i++) {
    const t = tiers > 1 ? i / (tiers - 1) : 0;
    const r = radius * (1 - t * 0.82);
    const h = span * (0.42 - t * 0.12);
    const yBase = trunkH + t * (span - h);
    list.push({ yBase, h, r });
    const capH = h * capCover;
    caps.push({ yBase: yBase + h * (1 - capCover) + h * 0.02, h: capH, r: r * (capCover + 0.06) });
  }
  const cones = list.concat(caps);
  const envelope = (y) => {
    let best = 0;
    for (const c of cones) {
      if (y < c.yBase || y > c.yBase + c.h) continue;
      best = Math.max(best, c.r * (1 - (y - c.yBase) / c.h));
    }
    return best;
  };
  return { height, radius, trunkH, tiers: list, caps, envelope };
}

/**
 * Wrap a fir with string lights: several spiral strands plus scattered bulbs.
 * Calls emit(x, y, z) in the tree's local space.
 */
function wrapLights(desc, count, rng, emit, { strands = 3, turns = 7, offset = 0.12, scatter = 0.3 } = {}) {
  const top = desc.height * 0.985;
  const minY = desc.trunkH + 0.1;
  let placed = 0, guard = 0;
  while (placed < count && guard++ < count * 40) {
    const y = minY + rng() * (top - minY);
    const env = desc.envelope(y);
    if (env <= 0.05) continue;
    if (rng() > env / desc.radius + 0.06) continue; // density ∝ surface area
    let a;
    if (rng() > scatter) {
      const s = placed % strands;
      a = (s / strands) * Math.PI * 2 + (y / desc.height) * turns * Math.PI * 2 + (rng() - 0.5) * 0.25;
    } else {
      a = rng() * Math.PI * 2;
    }
    const r = env + offset + rng() * 0.06;
    emit(Math.cos(a) * r, y, Math.sin(a) * r);
    placed++;
  }
  return placed;
}

/** Push instance matrices for one tree into the given instanced arrays. */
function pushFirInstances(desc, position, rotY, out) {
  const m = new THREE.Matrix4();
  const q = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 1, 0), rotY);
  const s = new THREE.Vector3();
  const p = new THREE.Vector3();
  for (const t of desc.tiers) {
    p.set(position.x, position.y + t.yBase, position.z);
    out.foliage.push(m.compose(p, q, s.set(t.r, t.h, t.r)).clone());
  }
  for (const c of desc.caps) {
    p.set(position.x, position.y + c.yBase, position.z);
    out.caps.push(m.compose(p, q, s.set(c.r, c.h, c.r)).clone());
  }
  p.set(position.x, position.y - 0.2, position.z);
  const tr = desc.radius * 0.12;
  out.trunks.push(m.compose(p, q, s.set(tr, desc.trunkH + 0.6, tr)).clone());
}

function toInstancedMesh(geometry, material, matrices, name) {
  const mesh = new THREE.InstancedMesh(geometry, material, matrices.length);
  matrices.forEach((mx, i) => mesh.setMatrixAt(i, mx));
  mesh.instanceMatrix.needsUpdate = true;
  mesh.computeBoundingSphere();
  mesh.name = name;
  return mesh;
}

// ===== world/ground.js =====


// Snowfield: flat around the rink, gently rolling further out, plus snow
// drifts banked against the rink boards and around tree bases.

function heightAt(x, z) {
  const e = (rinkDist(x, z) + RINK.radius) / RINK.radius;   // 1 = at the boards
  const t = THREE.MathUtils.smoothstep(e, 1.15, 2.3);
  const h = Math.sin(x * 0.08) * Math.cos(z * 0.07) + Math.sin(x * 0.031 + z * 0.043) * 1.4 + 1.2;
  return t * Math.max(0, h) * 0.9;
}

function createGround({ glow }) {
  const group = new THREE.Group();
  group.name = 'Snowfield';

  const geo = new THREE.PlaneGeometry(560, 560, 160, 160);
  geo.rotateX(-Math.PI / 2);
  const p = geo.attributes.position;
  for (let i = 0; i < p.count; i++) p.setY(i, heightAt(p.getX(i), p.getZ(i)));
  geo.computeVertexNormals();

  const snowMat = glow.patch(new THREE.MeshStandardMaterial({ color: PALETTE.snow, roughness: 0.95 }), 1);
  const ground = new THREE.Mesh(geo, snowMat);
  ground.name = 'SnowGround';
  group.add(ground);

  function addDrifts(treePlacements) {
    const rng = mulberry32(31);
    const mats = [];
    const m = new THREE.Matrix4(), q = new THREE.Quaternion(), s = new THREE.Vector3(), v = new THREE.Vector3();
    const up = new THREE.Vector3(0, 1, 0);
    const outer = RINK.boardThickness;

    // banked snow along the outside of the boards
    const N = 128;
    for (let i = 0; i < N; i++) {
      const off = outer + 0.6 + rng() * 1.2;
      const pp = rinkPerimeterPoint(i / N + rng() * 0.002, off);
      const x = pp.x, z = pp.z;
      // align the drift's long (local x) axis with the outline tangent
      q.setFromAxisAngle(up, Math.atan2(-pp.tz, pp.tx));
      v.set(x, -0.12, z);
      s.set(2.2 + rng() * 1.6, 0.55 + rng() * 0.4, 1.1 + rng() * 0.8);
      mats.push(m.compose(v, q, s).clone());
    }
    // mounds hugging tree bases
    for (const t of treePlacements) {
      for (let k = 0; k < 2; k++) {
        const a = rng() * Math.PI * 2;
        const r = t.radius * (0.55 + rng() * 0.3);
        v.set(t.position.x + Math.cos(a) * r, t.position.y - 0.1, t.position.z + Math.sin(a) * r);
        q.setFromAxisAngle(up, rng() * Math.PI);
        s.set(1.6 + rng() * 1.6, 0.5 + rng() * 0.5, 1.2 + rng() * 1.2);
        mats.push(m.compose(v, q, s).clone());
      }
    }

    const driftGeo = new THREE.SphereGeometry(1, 14, 7, 0, Math.PI * 2, 0, Math.PI / 2);
    const drifts = new THREE.InstancedMesh(driftGeo, snowMat, mats.length);
    mats.forEach((mx, i) => drifts.setMatrixAt(i, mx));
    drifts.instanceMatrix.needsUpdate = true;
    drifts.computeBoundingSphere();
    drifts.name = 'SnowDrifts';
    group.add(drifts);
  }

  return { group, addDrifts, material: snowMat };
}

// ===== world/iceRink.js =====




// Elliptical ice rink. The ice is a planar Reflector with a custom shader:
//  - bright lavender-blue ice matching the reference background image (colour pre-inverted
//    against the tone mapping so it shows as in the image)
//  - real mirror reflection of the lights, stretched toward the viewer like the image's light streaks
//  - fine whitish skate scratches (procedural texture), small view-dependent sparkles
//  - a soft warm pool from the central tree, lighter frost toward the boards

const IceShader = {
  name: 'WinterIceShader',
  uniforms: {
    color: { value: null },
    tDiffuse: { value: null },
    textureMatrix: { value: null },
    uRadii: { value: new THREE.Vector2(RINK.half, RINK.radius) },   // capsule: straight half-length, end radius
    uWarm: { value: new THREE.Color(1.0, 0.42, 0.12) },
    uDeep: { value: sceneColorForDisplay(0x969bd0) },      // ice colour sampled from the reference image
    uFrost: { value: sceneColorForDisplay(0xb9b6da) },
    uScratchCol: { value: sceneColorForDisplay(0xd4d6f2) },
    tScratch: { value: null },
    uReflectStrength: { value: 0.85 },
    uGlowStrength: { value: 0.35 },
    uBlur: { value: 0.0025 },
  },
  vertexShader: /* glsl */ `
    uniform mat4 textureMatrix;
    varying vec4 vUvProj;
    varying vec2 vLocal;
    varying vec3 vWorld;
    #include <common>
    #include <logdepthbuf_pars_vertex>
    void main() {
      vUvProj = textureMatrix * vec4( position, 1.0 );
      vLocal = position.xy;
      vec4 wp = modelMatrix * vec4( position, 1.0 );
      vWorld = wp.xyz;
      gl_Position = projectionMatrix * viewMatrix * wp;
      #include <logdepthbuf_vertex>
    }`,
  fragmentShader: /* glsl */ `
    uniform vec3 color;
    uniform sampler2D tDiffuse;
    uniform vec2 uRadii;
    uniform vec3 uWarm;
    uniform vec3 uDeep;
    uniform vec3 uFrost;
    uniform vec3 uScratchCol;
    uniform sampler2D tScratch;
    uniform float uReflectStrength;
    uniform float uGlowStrength;
    uniform float uBlur;
    varying vec4 vUvProj;
    varying vec2 vLocal;
    varying vec3 vWorld;
    #include <logdepthbuf_pars_fragment>

    float hash( vec2 p ) { return fract( sin( dot( p, vec2( 127.1, 311.7 ) ) ) * 43758.5453 ); }
    float noise( vec2 p ) {
      vec2 i = floor( p ), f = fract( p );
      f = f * f * ( 3.0 - 2.0 * f );
      return mix( mix( hash( i ), hash( i + vec2( 1.0, 0.0 ) ), f.x ),
                  mix( hash( i + vec2( 0.0, 1.0 ) ), hash( i + vec2( 1.0, 1.0 ) ), f.x ), f.y );
    }
    float fbm( vec2 p ) {
      float v = 0.0, a = 0.5;
      for ( int i = 0; i < 4; i ++ ) { v += a * noise( p ); p *= 2.03; a *= 0.5; }
      return v;
    }

    void main() {
      #include <logdepthbuf_fragment>
      float d = length( vec2( max( abs( vLocal.x ) - uRadii.x, 0.0 ), vLocal.y ) ) / uRadii.y;   // 0 = centre line, 1 = boards
      float n = fbm( vLocal * 0.35 );

      // rippled mirror reflection, smeared toward the viewer (long soft light streaks)
      vec2 offs = ( vec2( fbm( vLocal * 0.6 ), fbm( vLocal * 0.6 + 17.3 ) ) - 0.5 ) * 0.012;
      vec4 uv = vUvProj;
      uv.xy += offs * uv.w;
      float b = uBlur * uv.w;
      vec3 refl = texture2DProj( tDiffuse, uv ).rgb * 0.26;
      refl += texture2DProj( tDiffuse, uv + vec4(  b, 0.0, 0.0, 0.0 ) ).rgb * 0.1;
      refl += texture2DProj( tDiffuse, uv + vec4( -b, 0.0, 0.0, 0.0 ) ).rgb * 0.1;
      refl += texture2DProj( tDiffuse, uv + vec4( 0.0,  2.5 * b, 0.0, 0.0 ) ).rgb * 0.14;
      refl += texture2DProj( tDiffuse, uv + vec4( 0.0, -2.5 * b, 0.0, 0.0 ) ).rgb * 0.14;
      refl += texture2DProj( tDiffuse, uv + vec4( 0.0,  6.0 * b, 0.0, 0.0 ) ).rgb * 0.13;
      refl += texture2DProj( tDiffuse, uv + vec4( 0.0, -6.0 * b, 0.0, 0.0 ) ).rgb * 0.13;

      vec3 V = normalize( cameraPosition - vWorld );
      float cosT = clamp( V.y, 0.0, 1.0 );
      float fres = 0.04 + 0.96 * pow( 1.0 - cosT, 5.0 );
      float reflAmt = uReflectStrength * mix( 0.45, 1.0, fres ) * ( 0.85 + 0.15 * n );

      vec3 base = uDeep * ( 0.92 + 0.16 * n );

      // soft warm light from the central tree (same physical size as on the original 30 × 21 rink)
      float dg = length( vLocal / vec2( 30.0, 21.0 ) );
      float glow = exp( - pow( dg * 2.2, 1.6 ) ) * 0.55 + exp( - dg * 5.0 ) * 0.4;
      vec3 warm = uWarm * glow * uGlowStrength * ( 0.9 + 0.2 * n );

      // lighter, scuffed frost toward the boards
      float frost = smoothstep( 0.8, 1.0, d ) * ( 0.5 + 0.5 * n );

      // skate scratches: two scales of the procedural texture, fading out in the distance
      float dist = length( cameraPosition - vWorld );
      float sc = texture2D( tScratch, vWorld.xz / 9.0 ).r * 0.75 + texture2D( tScratch, vWorld.zx / 23.0 + 0.37 ).r * 0.5;
      sc *= mix( 1.0, 0.45, smoothstep( 15.0, 45.0, dist ) );

      // tiny sparkles that wink as the camera moves
      vec2 cell = floor( vWorld.xz * 22.0 ), cf = fract( vWorld.xz * 22.0 ) - 0.5;
      float h = hash( cell );
      float tw = pow( max( 0.0, sin( h * 90.0 + dot( cameraPosition.xz, vec2( 1.7, 1.3 ) ) * 1.3 ) ), 24.0 );
      float sparkle = step( 0.988, h ) * tw * smoothstep( 0.22, 0.0, length( cf ) ) * smoothstep( 22.0, 5.0, dist );

      vec3 col = base + warm;
      col = mix( col, uFrost, frost * 0.55 );
      col = mix( col, uScratchCol, clamp( sc, 0.0, 1.0 ) * 0.3 );
      col += refl * reflAmt * vec3( 0.9, 0.92, 1.0 );
      col += uWarm * 0.07 * smoothstep( 0.78, 1.0, d ) * ( 0.7 + 0.3 * n );   // rail lights glancing off the ice near the boards
      col += vec3( 1.6, 1.65, 1.8 ) * sparkle;

      gl_FragColor = vec4( col, 1.0 );
      #include <tonemapping_fragment>
      #include <colorspace_fragment>
    }`,
};

// Fine, curving skate scratches (white on black, tileable enough at the scales used in the shader).
function makeScratchTexture(renderer, size = 1024) {
  const cv = document.createElement('canvas');
  cv.width = cv.height = size;
  const g = cv.getContext('2d');
  g.fillStyle = '#000'; g.fillRect(0, 0, size, size);
  const rng = mulberry32(4242);
  g.lineCap = 'round';
  for (let i = 0; i < 300; i++) {
    const x = rng() * size, y = rng() * size, a = rng() * Math.PI * 2, len = 120 + rng() * 620, bend = (rng() - 0.5) * 1.6;
    const ex = x + Math.cos(a) * len, ey = y + Math.sin(a) * len;
    const cx = (x + ex) / 2 + Math.cos(a + Math.PI / 2) * len * bend * 0.5, cy = (y + ey) / 2 + Math.sin(a + Math.PI / 2) * len * bend * 0.5;
    g.strokeStyle = `rgba(255,255,255,${0.1 + rng() * 0.32})`;
    g.lineWidth = 0.6 + rng() * 1.6;
    for (const [ox, oy] of [[0, 0], [-size, 0], [size, 0], [0, -size], [0, size]]) {     // wrap around the tile edges
      g.beginPath(); g.moveTo(x + ox, y + oy); g.quadraticCurveTo(cx + ox, cy + oy, ex + ox, ey + oy); g.stroke();
    }
  }
  const t = new THREE.CanvasTexture(cv);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.anisotropy = Math.min(8, renderer.capabilities.getMaxAnisotropy());
  return t;
}

function createIceRink({ renderer, glow, bulbs, reflectionScale = 0.5 }) {
  const group = new THREE.Group();
  group.name = 'IceRink';

  // --- ice ------------------------------------------------------------------
  const shape = rinkShape(0);
  const iceGeo = new THREE.ShapeGeometry(shape, 96);

  const size = renderer.getDrawingBufferSize(new THREE.Vector2());
  const ice = new Reflector(iceGeo, {
    clipBias: 0.003,
    textureWidth: Math.max(256, Math.floor(size.x * reflectionScale)),
    textureHeight: Math.max(256, Math.floor(size.y * reflectionScale)),
    color: 0xffffff,
    shader: IceShader,
    multisample: 0,
  });
  ice.rotation.x = -Math.PI / 2;
  ice.position.y = RINK.iceY;
  ice.name = 'Ice';
  ice.material.uniforms.tScratch.value = makeScratchTexture(renderer);
  group.add(ice);

  // --- boards ---------------------------------------------------------------
  const t = RINK.boardThickness;
  const ring = rinkShape(t);
  ring.holes.push(rinkShape(0, THREE.Path));
  const boardGeo = new THREE.ExtrudeGeometry(ring, { depth: RINK.boardHeight, bevelEnabled: false, curveSegments: 96 });
  boardGeo.rotateX(-Math.PI / 2);
  const boardMat = glow.patch(new THREE.MeshStandardMaterial({ color: PALETTE.boards, roughness: 0.55 }), 1);
  const boards = new THREE.Mesh(boardGeo, boardMat);
  boards.name = 'RinkBoards';
  group.add(boards);

  // --- warm string lights along the top rail --------------------------------
  const rng = mulberry32(9);
  const perimeter = 4 * RINK.half + 2 * Math.PI * (RINK.radius + t / 2);
  const count = Math.floor(perimeter / 0.55);
  for (let i = 0; i < count; i++) {
    const pp = rinkPerimeterPoint(i / count, t / 2);
    const sag = 0.06 * Math.abs(Math.sin(i * 0.5 * Math.PI)); // tiny scallop between posts
    const c = warmBulbColor(rng, PALETTE, LIGHTING.bulbIntensity);
    bulbs.add(pp.x, RINK.boardHeight + 0.1 - sag, pp.z, 0.2, c[0] * 0.8, c[1] * 0.8, c[2] * 0.8);
  }

  return {
    group,
    ice,
    setSize(w, h) {
      ice.getRenderTarget().setSize(Math.max(256, Math.floor(w * reflectionScale)), Math.max(256, Math.floor(h * reflectionScale)));
    },
  };
}

// ===== world/christmasTree.js =====




// The visual heart of the scene: a huge, full tree in the middle of the ice,
// wrapped in ~1700 warm bulbs, a glowing star, on a small snow island.

function createChristmasTree({ glow, bulbs }) {
  const rng = mulberry32(1225);
  const group = new THREE.Group();
  group.name = 'ChristmasTree';

  const { height, radius, tiers } = CENTER_TREE;
  const base = new THREE.Vector3(0, RINK.iceY + 0.35, 0);
  const desc = describeFir({ height, radius, tiers, capCover: 0.34 });
  const out = { foliage: [], caps: [], trunks: [] };
  pushFirInstances(desc, base, 0.3, out);

  // Faint warm self-illumination so the tree reads as lit from within.
  const foliageMat = glow.patch(
    new THREE.MeshStandardMaterial({ color: PALETTE.foliageCenter, roughness: 0.85, emissive: 0x1c0a03, emissiveIntensity: 1 }),
    1.4
  );
  const snowMat = glow.patch(new THREE.MeshStandardMaterial({ color: PALETTE.snow, roughness: 0.85 }), 1);
  const trunkMat = new THREE.MeshStandardMaterial({ color: PALETTE.trunk, roughness: 1 });
  group.add(toInstancedMesh(createFoliageGeometry(), foliageMat, out.foliage, 'TreeFoliage'));
  group.add(toInstancedMesh(createSnowCapGeometry(), snowMat, out.caps, 'TreeSnow'));
  group.add(toInstancedMesh(createTrunkGeometry(), trunkMat, out.trunks, 'TreeTrunk'));

  // ~1700 small bulbs on four spiral strands + scatter
  wrapLights(desc, CENTER_TREE.bulbs, rng, (x, y, z) => {
    const c = warmBulbColor(rng, PALETTE, LIGHTING.bulbIntensity);
    bulbs.add(x, base.y + y, z, 0.24, c[0], c[1], c[2]);
  }, { strands: 4, turns: 9, offset: 0.14, scatter: 0.4 });

  // a few larger amber "lantern" glows tucked into the branches for depth
  wrapLights(desc, 70, rng, (x, y, z) => {
    bulbs.add(x * 0.97, base.y + y, z * 0.97, 0.75, 1.3, 0.62, 0.22);
  }, { strands: 1, turns: 3, offset: 0.05, scatter: 1 });

  // --- star -------------------------------------------------------------------
  const shape = new THREE.Shape();
  for (let i = 0; i < 10; i++) {
    const a = (i / 10) * Math.PI * 2 + Math.PI / 2;
    const r = i % 2 === 0 ? 1.15 : 0.47;
    if (i === 0) shape.moveTo(Math.cos(a) * r, Math.sin(a) * r);
    else shape.lineTo(Math.cos(a) * r, Math.sin(a) * r);
  }
  shape.closePath();
  const starGeo = new THREE.ExtrudeGeometry(shape, { depth: 0.3, bevelEnabled: true, bevelSize: 0.06, bevelThickness: 0.06, bevelSegments: 1 });
  starGeo.center();
  const star = new THREE.Mesh(starGeo, new THREE.MeshBasicMaterial({ color: new THREE.Color(4.5, 2.6, 1.0), fog: false }));
  star.position.set(0, base.y + height + 0.9, 0);
  group.add(star);
  bulbs.add(0, star.position.y, 0, 4.2, 1.6, 0.85, 0.35); // soft halo around the star

  // --- snow island the tree stands on ----------------------------------------
  const island = new THREE.Mesh(
    new THREE.SphereGeometry(1, 28, 8, 0, Math.PI * 2, 0, Math.PI / 2),
    snowMat
  );
  island.scale.set(ISLAND_RADIUS, 0.85, ISLAND_RADIUS);
  island.position.y = RINK.iceY - 0.05;
  island.name = 'SnowIsland';
  group.add(island);

  // warm bounce from the bulbs onto the tree's own snow & island
  glow.add(0, 2.5, 0, 8.5, 0.32);
  glow.add(0, 8.0, 0, 6.5, 0.26);
  glow.add(0, 13.5, 0, 4.5, 0.22);

  return {
    group,
    star,
    update(t) {
      star.rotation.y = t * 0.35;
    },
  };
}

// ===== world/forest.js =====




// 22 snow-covered firs in a loose ring around the rink, with the arc in
// front of the camera left open so the rink and central tree read clearly.

function createForest({ glow, bulbs, heightAt }) {
  const rng = mulberry32(FOREST.seed);
  const group = new THREE.Group();
  group.name = 'WinterForest';

  const [gapA, gapB] = FOREST.frontGapDeg.map(THREE.MathUtils.degToRad);
  const arcStart = gapB;
  const arcLen = Math.PI * 2 - (gapB - gapA);

  const placements = [];
  const out = { foliage: [], caps: [], trunks: [] };

  for (let i = 0; i < FOREST.count; i++) {
    const theta = arcStart + ((i + 0.5) / FOREST.count) * arcLen + (rng() - 0.5) * 0.12;
    const back = Math.max(0, -Math.sin(theta)); // 1 = behind the central tree
    const height = 7.5 + rng() * 3.5 + back * 4.5 + (i % 3 === 0 ? 2 : 0);
    const radius = height * (0.34 + rng() * 0.06);
    const edge = rinkEdgePoint(theta, 0.4);
    const d = radius + 2.2 + rng() * 10 + back * 5;
    const x = edge.x + edge.nx * d;
    const z = edge.z + edge.nz * d;
    const position = new THREE.Vector3(x, heightAt(x, z) - 0.1, z);
    const rotY = rng() * Math.PI * 2;
    const tiers = height > 11 ? 5 : 4;
    const desc = describeFir({ height, radius, tiers, capCover: 0.6 });

    pushFirInstances(desc, position, rotY, out);
    placements.push({ position, height, radius, theta });

    // dense warm string lights wound around the branches
    const count = Math.round(1.25 * height * height);
    const cos = Math.cos(rotY), sin = Math.sin(rotY);
    wrapLights(desc, count, rng, (lx, ly, lz) => {
      const c = warmBulbColor(rng, PALETTE, LIGHTING.bulbIntensity);
      bulbs.add(position.x + lx * cos - lz * sin, position.y + ly, position.z + lx * sin + lz * cos, 0.2, c[0], c[1], c[2]);
    }, { strands: 2, turns: 4 + height * 0.25, offset: 0.1, scatter: 0.35 });

    // soft bounce of those bulbs onto the tree's own snow and the ground
    glow.add(position.x, position.y + height * 0.32, position.z, height * 0.6, 0.14);
  }

  const foliageMat = glow.patch(new THREE.MeshStandardMaterial({ color: PALETTE.foliage, roughness: 0.9 }), 1);
  const snowMat = glow.patch(new THREE.MeshStandardMaterial({ color: PALETTE.snow, roughness: 0.85 }), 1);
  const trunkMat = new THREE.MeshStandardMaterial({ color: PALETTE.trunk, roughness: 1 });

  group.add(toInstancedMesh(createFoliageGeometry(), foliageMat, out.foliage, 'ForestFoliage'));
  group.add(toInstancedMesh(createSnowCapGeometry(), snowMat, out.caps, 'ForestSnow'));
  group.add(toInstancedMesh(createTrunkGeometry(), trunkMat, out.trunks, 'ForestTrunks'));

  return { group, placements };
}

// ===== world/lights.js =====


// Only 15 real point lights in the whole scene (+ hemisphere + moon).
// Thousands of bulbs are emissive sprites; these lights just carry their
// combined warmth onto snow, boards and branches.

function createLights({ moonDir }) {
  const group = new THREE.Group();
  group.name = 'Lighting';

  const { hemi, moon, treeRing, treeTop, forest, rail } = LIGHTING;

  // cold, dim ambient from the night sky
  group.add(new THREE.HemisphereLight(hemi.sky, hemi.ground, hemi.intensity));

  // faint cool moonlight for rim / shape on snow
  const moonLight = new THREE.DirectionalLight(moon.color, moon.intensity);
  moonLight.position.copy(moonDir).multiplyScalar(100).setY(60);
  group.add(moonLight);

  // warm lights around the central tree (outside the foliage so they light its surface)
  const pointLights = [];
  for (let i = 0; i < treeRing.count; i++) {
    const a = (i / treeRing.count) * Math.PI * 2 + Math.PI / 2;
    const l = new THREE.PointLight(PALETTE.warmLight, treeRing.intensity, treeRing.distance, treeRing.decay);
    l.position.set(Math.cos(a) * treeRing.radius, treeRing.y, Math.sin(a) * treeRing.radius);
    group.add(l);
    pointLights.push(l);
  }
  const top = new THREE.PointLight(0xffa155, treeTop.intensity, treeTop.distance, treeTop.decay);
  top.position.set(0, treeTop.y, treeTop.z);
  group.add(top);
  pointLights.push(top);

  // warm pools inside the forest ring, nudged toward the rink so they light
  // the faces of the trees that the camera sees
  for (const deg of forest.anglesDeg) {
    const a = THREE.MathUtils.degToRad(deg);
    const l = new THREE.PointLight(PALETTE.warmLight, forest.intensity, forest.distance, forest.decay);
    const e = rinkEdgePoint(a, forest.offset);
    l.position.set(e.x, forest.y, e.z);
    group.add(l);
    pointLights.push(l);
  }

  // soft warm pools spread evenly around the rink edge, so no single spot carries all the light
  for (let i = 0; i < rail.count; i++) {
    const pp = rinkPerimeterPoint((i + 0.5) / rail.count, rail.offset);   // evenly spaced along the outline
    const l = new THREE.PointLight(rail.color, rail.intensity, rail.distance, rail.decay);
    l.position.set(pp.x, rail.y, pp.z);
    group.add(l);
    pointLights.push(l);
  }

  const base = pointLights.map((l) => l.intensity);
  return {
    group,
    pointLights,
    // very slight candle-like breathing so the light feels alive
    update(t) {
      pointLights.forEach((l, i) => {
        l.intensity = base[i] * (0.94 + 0.04 * Math.sin(t * 1.7 + i * 2.1) + 0.02 * Math.sin(t * 4.3 + i));
      });
    },
  };
}

// Character-only soft fill: adds a wrapped, very soft cream light coming from the viewer's side
// (slightly above and to the right) to the skater's own materials, as indirect diffuse (no shine).
// It travels with the camera, so the face, hair and hoodie keep the same gentle brightness anywhere,
// while the real scene lights (tree, forest, moon) still add their warm/cool colour on top.
function addSoftFill(root, { color, intensity, boost = 1 }) {
  const uFill = { value: new THREE.Color(color).multiplyScalar(intensity) };
  const uBoost = { value: boost };   // brightens every light falling on the skater (not the scene)
  const done = new Set();
  root.traverse((o) => {
    const m = o.material;
    if (!m || done.has(m) || !(m.isMeshStandardMaterial)) return;
    done.add(m);
    m.onBeforeCompile = (sh) => {
      sh.uniforms.uSoftFill = uFill;
      sh.uniforms.uCharBoost = uBoost;
      sh.fragmentShader = 'uniform vec3 uSoftFill;\nuniform float uCharBoost;\n' + sh.fragmentShader.replace('#include <lights_fragment_end>', `#include <lights_fragment_end>
        reflectedLight.directDiffuse *= uCharBoost; reflectedLight.directSpecular *= uCharBoost;
        reflectedLight.indirectDiffuse *= uCharBoost; reflectedLight.indirectSpecular *= uCharBoost;
        {
          float w = dot( normal, normalize( vec3( 0.3, 0.55, 1.0 ) ) ) * 0.5 + 0.5;   // view space: from the camera side
          reflectedLight.indirectDiffuse += uSoftFill * uCharBoost * ( w * w ) * BRDF_Lambert( material.diffuseColor );
        }`);
    };
    m.customProgramCacheKey = () => 'softfill';
    m.needsUpdate = true;
  });
  return uFill;
}

// ===== world/snowfall.js =====


// Gentle falling snow, animated entirely on the GPU (one draw call).

function createSnowfall({ count = 4800, area = 260, height = 40 } = {}) {
  const rng = mulberry32(5);
  const pos = new Float32Array(count * 3);
  const phase = new Float32Array(count);
  const speed = new Float32Array(count);
  for (let i = 0; i < count; i++) {
    pos[i * 3] = (rng() - 0.5) * area;
    pos[i * 3 + 1] = rng() * height;
    pos[i * 3 + 2] = (rng() - 0.5) * area;
    phase[i] = rng() * Math.PI * 2;
    speed[i] = 0.6 + rng() * 0.9;
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  geo.setAttribute('aPhase', new THREE.BufferAttribute(phase, 1));
  geo.setAttribute('aSpeed', new THREE.BufferAttribute(speed, 1));

  const mat = new THREE.ShaderMaterial({
    uniforms: { uTime: { value: 0 }, uHeight: { value: height }, uViewportH: { value: 1080 } },
    transparent: true,
    depthWrite: false,
    blending: THREE.AdditiveBlending,
    fog: false,
    vertexShader: /* glsl */ `
      uniform float uTime; uniform float uHeight; uniform float uViewportH;
      attribute float aPhase; attribute float aSpeed;
      varying float vA;
      void main() {
        vec3 p = position;
        p.y = mod( p.y - uTime * aSpeed, uHeight );
        p.x += sin( uTime * 0.3 + aPhase ) * 1.2;
        p.z += cos( uTime * 0.23 + aPhase * 1.7 ) * 0.8;
        vec4 mv = modelViewMatrix * vec4( p, 1.0 );
        gl_Position = projectionMatrix * mv;
        float dist = max( - mv.z, 0.1 );
        gl_PointSize = clamp( 0.14 * uViewportH * projectionMatrix[ 1 ][ 1 ] * 0.5 / dist, 1.0, 10.0 );
        vA = 0.32 * exp( - pow( dist * 0.012, 2.0 ) ) * smoothstep( 0.0, 2.0, p.y );
      }`,
    fragmentShader: /* glsl */ `
      varying float vA;
      void main() {
        float r = length( gl_PointCoord - 0.5 ) * 2.0;
        float a = smoothstep( 1.0, 0.2, r ) * vA;
        gl_FragColor = vec4( vec3( 0.78, 0.84, 0.95 ) * a, 1.0 );
      }`,
  });
  const points = new THREE.Points(geo, mat);
  points.frustumCulled = false;
  points.name = 'Snowfall';

  return {
    points,
    update(t) {
      mat.uniforms.uTime.value = t;
    },
    setViewportHeight(h) {
      mat.uniforms.uViewportH.value = h;
    },
  };
}
