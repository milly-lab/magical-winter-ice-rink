        lerp(0.05 + 0.03 * breathe, swing - 0.1, g),
        0,
        lerp(0.2, 1.05 + 0.12 * Math.sin(this.phase * 2 + side), g) * side
      );
      arm.elbow.rotation.x = lerp(-0.3, -0.35 + 0.1 * s * side, g);
    };
    armPose(R.armL, 1);
    armPose(R.armR, -1);
  }
}

// ===== input/pointerControls.js =====
// Mouse + touch on the canvas:
//  - drag (mouse or one finger)  → orbit the camera around the skater
//  - wheel / two-finger pinch    → smooth zoom (distance limited)
//  - click / tap on the ice      → skate to that spot
// A press only counts as a click/tap if it moved < 8 px and lasted < 400 ms,
// so dragging never triggers a move. WASD / arrow keys are untouched.

class PointerControls {
  constructor(dom, camera, follow, player, bounds, scene) {
    this.dom = dom;
    this.camera = camera;
    this.follow = follow;
    this.player = player;
    this.bounds = bounds;
    this.pointers = new Map();
    this.press = null;      // candidate click / tap
    this.pinchDist = 0;
    this.raycaster = new THREE.Raycaster();
    this.plane = new THREE.Plane(new THREE.Vector3(0, 1, 0), -bounds.iceY);
    this._ndc = new THREE.Vector2();
    this._hit = new THREE.Vector3();

    // small fading ring that marks the tapped destination
    this.marker = new THREE.Mesh(
      new THREE.RingGeometry(0.28, 0.36, 32),
      new THREE.MeshBasicMaterial({ color: 0xffd2a0, transparent: true, opacity: 0, depthWrite: false, fog: false })
    );
    this.marker.rotation.x = -Math.PI / 2;
    this.marker.position.y = bounds.iceY + 0.02;
    this.markerLife = 0;
    scene.add(this.marker);

    dom.style.touchAction = 'none';
    dom.addEventListener('pointerdown', (e) => this._down(e));
    dom.addEventListener('pointermove', (e) => this._move(e));
    dom.addEventListener('pointerup', (e) => this._up(e));
    dom.addEventListener('pointercancel', (e) => this._up(e, true));
    dom.addEventListener('wheel', (e) => {
      e.preventDefault();
      this.follow.zoom(Math.exp(e.deltaY * 0.0015));
    }, { passive: false });
    dom.addEventListener('contextmenu', (e) => e.preventDefault());
  }

  _down(e) {
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    this.dom.setPointerCapture(e.pointerId);
    this.pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (this.pointers.size === 1) {
      this.press = { id: e.pointerId, x: e.clientX, y: e.clientY, t: performance.now() };
    } else {
      this.press = null; // second finger: this is a pinch, not a tap
      this.pinchDist = this._pinchDistance();
    }
  }

  _move(e) {
    const prev = this.pointers.get(e.pointerId);
    if (!prev) return;
    const dx = e.clientX - prev.x, dy = e.clientY - prev.y;
    prev.x = e.clientX; prev.y = e.clientY;

    if (this.pointers.size >= 2) {
      const d = this._pinchDistance();
      if (this.pinchDist > 0 && d > 0) this.follow.zoom(this.pinchDist / d);
      this.pinchDist = d;
      return;
    }
    if (this.press && Math.hypot(e.clientX - this.press.x, e.clientY - this.press.y) > 8) this.press = null; // became a drag
    if (!this.press) this.follow.rotate(-dx * 0.006, dy * 0.004);
  }

  _up(e, cancelled = false) {
    if (!this.pointers.has(e.pointerId)) return;
    this.pointers.delete(e.pointerId);
    if (this.pointers.size < 2) this.pinchDist = 0;
    const p = this.press;
    if (!cancelled && p && p.id === e.pointerId && performance.now() - p.t < 400) this._tap(e.clientX, e.clientY);
    if (p && p.id === e.pointerId) this.press = null;
  }

  _pinchDistance() {
    const [a, b] = [...this.pointers.values()];
    return a && b ? Math.hypot(a.x - b.x, a.y - b.y) : 0;
  }

  _tap(cx, cy) {
    const r = this.dom.getBoundingClientRect();
    this._ndc.set(((cx - r.left) / r.width) * 2 - 1, -((cy - r.top) / r.height) * 2 + 1);
    this.raycaster.setFromCamera(this._ndc, this.camera);
    if (!this.raycaster.ray.intersectPlane(this.plane, this._hit)) return;
    let { x, z } = this._hit;
    const { rx, rz, islandRadius } = this.bounds;
    if ((x / rx) ** 2 + (z / rz) ** 2 > 1) return;          // only taps on the rink floor
    const e = Math.hypot(x / (rx - 0.8), z / (rz - 0.8));   // same limits as movement
    if (e > 1) { x /= e; z /= e; }
    const rr = Math.hypot(x, z), minR = islandRadius + 0.8;
    if (rr < minR) { const k = minR / Math.max(rr, 1e-3); x *= k; z *= k; }
    this.player.setTarget(x, z);
    this.marker.position.x = x;
    this.marker.position.z = z;
    this.markerLife = 1;
  }

  update(dt) {
    if (this.player.target === null) this.markerLife = Math.min(this.markerLife, 0.4);
    this.markerLife = Math.max(0, this.markerLife - dt * 0.7);
    this.marker.material.opacity = 0.75 * this.markerLife;
    this.marker.visible = this.markerLife > 0;
    this.marker.scale.setScalar(1 + (1 - this.markerLife) * 0.6);
  }
}

// ===== fx/skateFx.js =====
// Ice dust + skate marks, driven by the skater's real blade positions.
//  - dust: tiny twinkling sparks kicked up from each blade on the ice, more at speed
//    (one Points draw call, fixed pool, GPU fade)
//  - marks: thin scratch lines along the actual blade paths, held ~3 s then fade out
//    (one Mesh draw call, fixed ring buffer of quads)

class SkateFX {
  constructor(scene, player, bounds, { dust = 260, marks = 1500 } = {}) {
    this.player = player;
    this.iceY = bounds.iceY;
    this.time = 0;
    this._v = new THREE.Vector3();

    // ---- dust pool ----
    this.dN = dust;
    this.dPos = new Float32Array(dust * 3);
    this.dVel = new Float32Array(dust * 3);
    this.dLife = new Float32Array(dust);   // remaining life (s)
    this.dMax = new Float32Array(dust);
    this.dNext = 0;
    const dg = new THREE.BufferGeometry();
    dg.setAttribute('position', new THREE.BufferAttribute(this.dPos, 3));
    dg.setAttribute('aLife', new THREE.BufferAttribute(new Float32Array(dust), 1));
    const seed = new Float32Array(dust); for (let i = 0; i < dust; i++) seed[i] = Math.random();
    dg.setAttribute('aSeed', new THREE.BufferAttribute(seed, 1));
    this.dustMat = new THREE.ShaderMaterial({
      uniforms: { uTime: { value: 0 }, uViewportH: { value: 1080 } },
      transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, fog: false,
      vertexShader: /* glsl */ `
        uniform float uTime; uniform float uViewportH;
        attribute float aLife; attribute float aSeed;
        varying float vA; varying float vFlash; varying float vShape; varying float vRot;
        void main() {
          vec4 mv = modelViewMatrix * vec4( position, 1.0 );
          gl_Position = projectionMatrix * mv;
          float size = mix( 0.045, 0.12, fract( aSeed * 7.13 ) );               // varied sizes
          float px = size * uViewportH * projectionMatrix[ 1 ][ 1 ] * 0.5 / max( - mv.z, 0.1 );
          gl_PointSize = aLife > 0.0 ? clamp( px, 1.5, 24.0 ) : 0.0;
          vShape = floor( fract( aSeed * 3.71 ) * 3.0 );                        // 0 bead · 1 star · 2 shard
          vRot = aSeed * 6.2831 + uTime * ( fract( aSeed * 5.3 ) - 0.5 ) * 7.0;   // tumbling crystals
          float tw = 0.65 + 0.35 * sin( uTime * 34.0 + aSeed * 61.0 );
          // ~35% of the crystals catch the light once: a quick bright glint before they vanish
          vFlash = step( fract( aSeed * 11.3 ), 0.35 ) * exp( - pow( ( aLife - 0.55 ) / 0.07, 2.0 ) );
          vA = pow( max( aLife, 0.0 ), 0.7 ) * tw * clamp( px / 2.0, 0.35, 1.0 );
        }`,
      fragmentShader: /* glsl */ `
        varying float vA; varying float vFlash; varying float vShape; varying float vRot;
        void main() {
          vec2 c = gl_PointCoord - 0.5;
          float cs = cos( vRot ), sn = sin( vRot );
          c = vec2( cs * c.x - sn * c.y, sn * c.x + cs * c.y );
          float r = length( c ) * 2.0;
          float core = exp( - r * r * 18.0 );                                   // crisp centre (not a soft snow blob)
          float star = ( exp( - abs( c.x ) * 34.0 ) * exp( - abs( c.y ) * 5.0 ) +
                         exp( - abs( c.y ) * 34.0 ) * exp( - abs( c.x ) * 5.0 ) ) * ( 1.0 - r );
          float shard = 1.0 - smoothstep( 0.18, 0.32, abs( c.x ) * 1.0 + abs( c.y ) * 3.4 );
          float shape = vShape < 0.5 ? core + star * 0.35 : ( vShape < 1.5 ? core * 0.8 + star : shard * 0.55 + core * 0.6 );
          float a = shape * vA;
          vec3 col = vec3( 0.72, 0.86, 1.0 ) * a * 0.95;                       // cold, see-through ice tone
          col += vec3( 0.95, 0.98, 1.0 ) * ( core * 2.0 + star * 1.2 ) * vFlash * 1.6; // brief bright glint
          if ( max( col.r, col.b ) < 0.004 ) discard;
          gl_FragColor = vec4( col, 1.0 );
        }`,
    });
    this.dust = new THREE.Points(dg, this.dustMat);
    this.dust.frustumCulled = false;
    scene.add(this.dust);

    // ---- marks ring buffer (4 verts / quad) ----
    this.mN = marks;
    this.mPos = new Float32Array(marks * 4 * 3);
    this.mBirth = new Float32Array(marks * 4).fill(-100);
    const idx = new Uint32Array(marks * 6);
    for (let i = 0; i < marks; i++) idx.set([i * 4, i * 4 + 1, i * 4 + 2, i * 4 + 2, i * 4 + 1, i * 4 + 3], i * 6);
    const mg = new THREE.BufferGeometry();
    mg.setAttribute('position', new THREE.BufferAttribute(this.mPos, 3));
    mg.setAttribute('aBirth', new THREE.BufferAttribute(this.mBirth, 1));
    mg.setAttribute('aEdge', new THREE.BufferAttribute(new Float32Array(marks * 4).map((_, i) => (i % 2 ? 1 : -1)), 1));
    this.mAcross = new Float32Array(marks * 4 * 2);
    mg.setAttribute('aAcross', new THREE.BufferAttribute(this.mAcross, 2));
    mg.setIndex(new THREE.BufferAttribute(idx, 1));
    this.markMat = new THREE.ShaderMaterial({
      uniforms: { uTime: { value: 0 } },
      transparent: true, depthWrite: false, fog: false,
      polygonOffset: true, polygonOffsetFactor: -2, polygonOffsetUnits: -2,
      vertexShader: /* glsl */ `
        attribute float aBirth; attribute float aEdge; attribute vec2 aAcross;
        varying float vAge; varying float vEdge; varying vec2 vAcross; varying vec2 vXZ;
        void main() {
          vAge = aBirth; vEdge = aEdge; vAcross = aAcross; vXZ = position.xz;
          gl_Position = projectionMatrix * modelViewMatrix * vec4( position, 1.0 );
        }`,
      fragmentShader: /* glsl */ `
        uniform float uTime;
        varying float vAge; varying float vEdge; varying vec2 vAcross; varying vec2 vXZ;
        void main() {
          float age = uTime - vAge;
          float life = ( 1.0 - smoothstep( 0.375, 0.5, age ) ) * smoothstep( 0.0, 0.03, age ); // gone ~0.5 s after it is cut
          float grad = 0.49 * mix( 0.8, 0.05, smoothstep( 0.0, 0.5, age ) );               // another 30% softer: newest ~39% → oldest ~2.5% (same ratio)
          float ae = abs( vEdge );
          float body = 1.0 - smoothstep( 0.8, 1.0, ae );
          // shallow groove: the wall facing the tree light catches a highlight, the other falls into shadow
          vec2 L = normalize( - vXZ + vec2( 1e-4 ) );
          float facing = dot( - sign( vEdge ) * vAcross, L );
          float wall = smoothstep( 0.3, 0.75, ae ) * ( 1.0 - smoothstep( 0.8, 1.0, ae ) );
          float hi = wall * max( facing, 0.0 );
          float sh = wall * max( - facing, 0.0 );
          float floorShade = 1.0 - smoothstep( 0.0, 0.45, ae );
          vec3 col = vec3( 0.11, 0.15, 0.21 );                                 // frosted floor of the cut
          col = mix( col, vec3( 0.03, 0.05, 0.08 ), clamp( sh * 0.85 + floorShade * 0.3, 0.0, 1.0 ) );
          col = mix( col, mix( vec3( 0.8, 0.9, 1.0 ), vec3( 1.0, 0.82, 0.62 ), 0.3 ), hi * 0.85 ); // lit lip (a touch of tree warmth)
          float a = body * grad * life;
          if ( a < 0.004 ) discard;
          gl_FragColor = vec4( col, a );
        }`,
    });
    this.marks = new THREE.Mesh(mg, this.markMat);
    this.marks.frustumCulled = false;
    this.marks.renderOrder = 1;
    scene.add(this.marks);
    this.mNext = 0;
    this.last = [null, null];  // last mark point per blade
    this.spawnAcc = [0, 0];
  }

  setViewportHeight(h) { this.dustMat.uniforms.uViewportH.value = h; }

  _blade(leg, out) {               // bottom-centre of the blade in world space
    return leg.ankle.localToWorld(out.set(0, -this.player.rig.L.foot, 0.03));
  }

  _addMark(a, b) {
    const dx = b.x - a.x, dz = b.z - a.z, len = Math.hypot(dx, dz);
    if (len < 1e-4) return;
    const w = 0.01 + Math.random() * 0.005;                         // 2–3 cm wide shallow cut
    const nx = (-dz / len) * w, nz = (dx / len) * w, y = this.iceY + 0.004;
    const i = this.mNext, o = i * 12;
    this.mPos.set([a.x - nx, y, a.z - nz, a.x + nx, y, a.z + nz, b.x - nx, y, b.z - nz, b.x + nx, y, b.z + nz], o);
    this.mBirth.fill(this.time, i * 4, i * 4 + 4);
    const ux = -dz / len, uz = dx / len;
    this.mAcross.set([ux, uz, ux, uz, ux, uz, ux, uz], i * 8);
    this.mNext = (i + 1) % this.mN;
    this.marksDirty = true;
  }

  _spawnDust(p, travel) {
    const i = this.dNext; this.dNext = (i + 1) % this.dN;
    const life = 0.25 + Math.random() * 0.35;
    this.dLife[i] = life; this.dMax[i] = life;
    this.dPos.set([p.x + (Math.random() - 0.5) * 0.12, this.iceY + 0.01, p.z + (Math.random() - 0.5) * 0.12], i * 3);
    const a = Math.random() * Math.PI * 2, s = 0.3 + Math.random() * 0.6;
    this.dVel.set([Math.cos(a) * s - travel.x * 0.12, 0.4 + Math.random() * 0.7, Math.sin(a) * s - travel.z * 0.12], i * 3);
  }

  update(dt) {
    this.time += dt;
    this.dustMat.uniforms.uTime.value = this.time;
    this.markMat.uniforms.uTime.value = this.time;
    const pl = this.player, R = pl.rig;
    pl.mesh.updateMatrixWorld(true);

    [R.legL, R.legR].forEach((leg, k) => {
      const p = this._blade(leg, new THREE.Vector3());
      const onIce = p.y < this.iceY + 0.03;
      const prev = this.last[k];
      if (!onIce) { this.last[k] = null; return; }
      if (prev) {
        const travel = this._v.set(p.x - prev.x, 0, p.z - prev.z);
        const d = travel.length();
        const speed = d / Math.max(dt, 1e-4);
        if (d > Math.max(0.1, speed * 0.012)) { this._addMark(prev, p); this.last[k] = p; } // longer segments at speed keep ~3.8 s of marks
        // dust: occasional, more at speed (≈1 → 12 sparks/s per blade)
        this.spawnAcc[k] += dt * Math.min(12, 0.4 + speed * 0.9) * (speed > 0.4 ? 1 : 0);
        while (this.spawnAcc[k] >= 1) {
          this.spawnAcc[k] -= 1;
          if (Math.random() < 0.7) this._spawnDust(p, travel.clone().multiplyScalar(1 / Math.max(dt, 1e-4)));
        }
      } else {
        this.last[k] = p;
      }
    });

    // dust simulation (tiny pool)
    const lifeAttr = this.dust.geometry.attributes.aLife;
    for (let i = 0; i < this.dN; i++) {
      if (this.dLife[i] <= 0) { lifeAttr.array[i] = 0; continue; }
      this.dLife[i] -= dt;
      const o = i * 3;
      this.dVel[o + 1] -= 3.0 * dt;
      this.dVel[o] *= 0.94; this.dVel[o + 2] *= 0.94;
      this.dPos[o] += this.dVel[o] * dt;
      this.dPos[o + 1] = Math.max(this.iceY + 0.005, this.dPos[o + 1] + this.dVel[o + 1] * dt);
      this.dPos[o + 2] += this.dVel[o + 2] * dt;
      lifeAttr.array[i] = Math.max(0, this.dLife[i] / this.dMax[i]);
    }
    lifeAttr.needsUpdate = true;
    this.dust.geometry.attributes.position.needsUpdate = true;
    if (this.marksDirty) {
      this.marks.geometry.attributes.position.needsUpdate = true;
      this.marks.geometry.attributes.aBirth.needsUpdate = true;
      this.marks.geometry.attributes.aAcross.needsUpdate = true;
      this.marksDirty = false;
    }
  }
}

// ===== main.js =====









// ---- renderer --------------------------------------------------------------
const renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.75));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = LIGHTING.exposure;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.getElementById('app').appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(38, window.innerWidth / window.innerHeight, 0.1, 1200);

// ---- background + lighting -------------------------------------------------
const world = createWinterWorld({ scene, renderer });
console.info('[WinterRink]', world.stats);

// ---- character (stand-in; keep your own in the real project) ---------------
const player = new PlaceholderPlayer(scene, world.bounds);
const cine = new FollowCamera(camera);
const controls = new PointerControls(renderer.domElement, camera, cine, player, world.bounds, scene);
const skateFx = new SkateFX(scene, player, world.bounds);
skateFx.setViewportHeight(renderer.getDrawingBufferSize(new THREE.Vector2()).y);

// ---- temporary Triple Axel button --------------------------------------------
const axelBtn = document.createElement('button');
axelBtn.textContent = '트리플 악셀';
axelBtn.style.cssText = [
  'position:fixed', 'left:50%', 'bottom:22px', 'transform:translateX(-50%)', 'z-index:10',
  'padding:9px 22px', 'border-radius:999px', 'border:1px solid rgba(243,217,184,.45)',
  'background:rgba(6,12,26,.55)', 'color:#f3d9b8', 'cursor:pointer',
  'font:300 13px/1 "Helvetica Neue", Arial, sans-serif', 'letter-spacing:.18em',
  'backdrop-filter:blur(4px)', '-webkit-backdrop-filter:blur(4px)', 'transition:opacity .3s',
].join(';');
axelBtn.addEventListener('click', () => {
  if (axelBtn.disabled) return;
  const started = player.startTripleAxel(() => { axelBtn.disabled = false; axelBtn.style.opacity = '1'; });
  if (started) { axelBtn.disabled = true; axelBtn.style.opacity = '0.4'; }
  axelBtn.blur();
});
document.body.appendChild(axelBtn);

// ---- post: HDR target with MSAA → bloom → tone mapping ---------------------
const buf = renderer.getDrawingBufferSize(new THREE.Vector2());
const rt = new THREE.WebGLRenderTarget(buf.x, buf.y, { type: THREE.HalfFloatType, samples: 4 });
const composer = new EffectComposer(renderer, rt);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), LIGHTING.bloom.strength, LIGHTING.bloom.radius, LIGHTING.bloom.threshold);
composer.addPass(bloom);
composer.addPass(new OutputPass());

function onResize() {
  const w = window.innerWidth, h = window.innerHeight;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
  composer.setSize(w, h);
  bloom.resolution.set(w, h);
  const b = renderer.getDrawingBufferSize(new THREE.Vector2());
  world.setSize(b.x, b.y, renderer.getPixelRatio());
  if (typeof skateFx !== 'undefined') skateFx.setViewportHeight(b.y);
}
window.addEventListener('resize', onResize);

// ---- loop ------------------------------------------------------------------
let last = performance.now();
const start = last;
renderer.setAnimationLoop((now) => {
  const dt = Math.min((now - last) / 1000, 0.05);
  last = now;
  const t = (now - start) / 1000;
  player.update(dt);
  cine.update(dt, player.position, player.heading);
  controls.update(dt);
  skateFx.update(dt);
  world.update(t);
  composer.render(dt);
});
