    <script type="module">
import * as THREE from 'three';
import { Reflector } from 'three/addons/objects/Reflector.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

// ===== world/config.js =====
// Magical Winter Forest Ice Rink — layout & look constants.
// Tweak values here to rebalance the scene without touching the builders.

const RINK = {
  rx: 30, // ice half-width  (x)
  rz: 21, // ice half-depth  (z)
  iceY: 0.03,
  boardHeight: 0.9,
  boardThickness: 0.35,
};

const ISLAND_RADIUS = 6.2; // snow island under the central tree

const CENTER_TREE = {
  height: 19,
  radius: 6.4,
  tiers: 8,
  bulbs: 1700,
};

const FOREST = {
  count: 22, // + 1 central tree = 23 trees total (limit 20~25)
  seed: 2026,
  frontGapDeg: [62, 118], // keep the arc in front of the camera open
};

const PALETTE = {
  skyTop: 0x010207,
  skyHorizon: 0x070f1f,
  skyBottom: 0x060c1a,
  fog: 0x060c1a,
  fogDensity: 0.0105,
  snow: 0xd8e2f0,
  foliage: 0x0d2618,
  foliageCenter: 0x0f2a1a,
  trunk: 0x2a1a10,
  boards: 0xcfd9e6,
  iceDeep: 0x041224,
  iceFrost: 0x3a5878,
  // warm bulb colour in linear RGB (values > 1 feed the bloom pass)
  bulbA: [1.0, 0.42, 0.1],
  bulbB: [1.0, 0.6, 0.22],
  warmLight: 0xff8c42,
};

const LIGHTING = {
  exposure: 1.05,
  hemi: { sky: 0x3a5a8c, ground: 0x0b0d14, intensity: 1.1 },
  moon: { color: 0x9fb4e0, intensity: 0.3 },
  treeRing: { count: 3, radius: 10, y: 3, intensity: 45, distance: 40, decay: 1.7 },
  treeTop: { y: 14, z: 7, intensity: 22, distance: 30, decay: 1.7 },
  forest: { anglesDeg: [200, 270, 340], offset: 8, y: 4.5, intensity: 30, distance: 35, decay: 1.7 },
  bloom: { strength: 0.85, radius: 0.55, threshold: 0.82 },
  bulbIntensity: [2.6, 4.2],
};

// Direction to the (small, faint) moon. Also used for the cool key light.
const MOON_DIR = [-0.42, 0.24, -0.88];

function mulberry32(seed) {
  let a = seed >>> 0;
  return function () {
    a = (a + 0x6d2b79f5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

// ===== world/warmGlow.js =====

// Cheap "bulb bounce" light: instead of giving every bulb a real light,
// standard materials get a few soft warm spheres of emissive glow injected
// via onBeforeCompile. Snow (white) catches it strongly, dark needles barely.

const MAX_GLOW_POINTS = 32;

function createWarmGlow(color = new THREE.Color(1.0, 0.42, 0.12)) {
  const points = Array.from({ length: MAX_GLOW_POINTS }, () => new THREE.Vector4(0, -9999, 0, 1));
  const strengths = new Array(MAX_GLOW_POINTS).fill(0);
  const shared = {
    uGlowPoints: { value: points },
    uGlowStrength: { value: strengths },
    uGlowCount: { value: 0 },
    uGlowColor: { value: color },
    uGlowFlicker: { value: 1 },
  };

  function add(x, y, z, radius, strength = 1) {
    const i = shared.uGlowCount.value;
    if (i >= MAX_GLOW_POINTS) return;
    points[i].set(x, y, z, radius);
    strengths[i] = strength;
    shared.uGlowCount.value = i + 1;
  }

  function patch(material, gain = 1) {
    const local = { uGlowGain: { value: gain } };
    material.onBeforeCompile = (shader) => {
      Object.assign(shader.uniforms, shared, local);
      shader.vertexShader =
        'varying vec3 vWarmWorld;\n' +
        shader.vertexShader.replace(
          '#include <project_vertex>',
          `#include <project_vertex>
          vec4 wgP = vec4( transformed, 1.0 );
          #ifdef USE_INSTANCING
            wgP = instanceMatrix * wgP;
          #endif
          vWarmWorld = ( modelMatrix * wgP ).xyz;`
        );
      shader.fragmentShader =
        `#define WG_MAX ${MAX_GLOW_POINTS}
        uniform vec4 uGlowPoints[WG_MAX];
        uniform float uGlowStrength[WG_MAX];
        uniform int uGlowCount;
        uniform vec3 uGlowColor;
        uniform float uGlowGain;
        uniform float uGlowFlicker;
        varying vec3 vWarmWorld;\n` +
        shader.fragmentShader.replace(
          '#include <emissivemap_fragment>',
          `#include <emissivemap_fragment>
          float wgSum = 0.0;
          for ( int i = 0; i < WG_MAX; i ++ ) {
            if ( i >= uGlowCount ) break;
            vec3 wgD = vWarmWorld - uGlowPoints[ i ].xyz;
            float wgR = uGlowPoints[ i ].w;
            wgSum += uGlowStrength[ i ] * exp( - dot( wgD, wgD ) / ( wgR * wgR ) );
          }
          totalEmissiveRadiance += uGlowColor * diffuseColor.rgb * wgSum * uGlowGain * uGlowFlicker;`
        );
    };
    material.customProgramCacheKey = () => 'warm-glow';
    return material;
  }

  return { add, patch, uniforms: shared };
}

// ===== world/bulbs.js =====

// Every string-light bulb in the scene (tree, forest, rink rail) lives in ONE
// THREE.Points draw call. Bulbs are HDR-bright sprites (> 1.0) so the bloom
// pass makes them glow; no per-bulb real-time lights.

const vertexShader = /* glsl */ `
  uniform float uTime;
  uniform float uViewportH;
  attribute vec3 aColor;
  attribute float aSize;
  attribute float aPhase;
  varying vec3 vColor;
  varying float vTw;
  void main() {
    vec4 mv = modelViewMatrix * vec4( position, 1.0 );
    gl_Position = projectionMatrix * mv;
    float dist = max( - mv.z, 0.1 );
    float px = aSize * uViewportH * projectionMatrix[ 1 ][ 1 ] * 0.5 / dist;
    gl_PointSize = clamp( px, 1.5, 48.0 );
    float speed = 0.8 + fract( aPhase * 13.37 ) * 2.2;
    vTw = 0.78 + 0.22 * sin( uTime * speed + aPhase * 6.2831 );
    vTw *= clamp( px / 1.5, 0.35, 1.0 );          // fade sub-pixel bulbs instead of shimmering
    vTw *= exp( - pow( dist * 0.006, 2.0 ) );     // gentle atmospheric falloff
    vColor = aColor;
  }
`;

const fragmentShader = /* glsl */ `
  varying vec3 vColor;
  varying float vTw;
  void main() {
    vec2 c = gl_PointCoord - 0.5;
    float r2 = dot( c, c ) * 4.0;
    if ( r2 > 1.0 ) discard;
    float core = exp( - r2 * 14.0 );
    float halo = exp( - r2 * 3.5 ) * 0.35;
    vec3 col = vColor * ( core + halo ) * vTw;
    col += vec3( 1.0, 0.86, 0.62 ) * core * vTw * 0.9;  // hot filament centre
    gl_FragColor = vec4( col, 1.0 );
  }
`;

class BulbField {
  constructor() {
    this.positions = [];
    this.colors = [];
    this.sizes = [];
    this.phases = [];
    this.material = null;
  }

  add(x, y, z, size, r, g, b) {
    this.positions.push(x, y, z);
    this.colors.push(r, g, b);
    this.sizes.push(size);
    this.phases.push(Math.random());
  }

  get count() {
    return this.sizes.length;
  }

  build() {
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.Float32BufferAttribute(this.positions, 3));
    geo.setAttribute('aColor', new THREE.Float32BufferAttribute(this.colors, 3));
    geo.setAttribute('aSize', new THREE.Float32BufferAttribute(this.sizes, 1));
    geo.setAttribute('aPhase', new THREE.Float32BufferAttribute(this.phases, 1));
    geo.computeBoundingSphere();

    this.material = new THREE.ShaderMaterial({
      uniforms: { uTime: { value: 0 }, uViewportH: { value: 1080 } },
      vertexShader,
      fragmentShader,
      transparent: true,
      depthWrite: false,
      blending: THREE.AdditiveBlending,
      fog: false,
    });
    const points = new THREE.Points(geo, this.material);
    points.name = 'StringLights';
    points.frustumCulled = false;
    return points;
  }
}

// Helper: a warm bulb colour with slight per-bulb variation (linear HDR).
function warmBulbColor(rng, palette, intensityRange) {
  const t = rng();
  const k = intensityRange[0] + rng() * (intensityRange[1] - intensityRange[0]);
  const [a, b] = [palette.bulbA, palette.bulbB];
  return [
    (a[0] + (b[0] - a[0]) * t) * k,
    (a[1] + (b[1] - a[1]) * t) * k,
    (a[2] + (b[2] - a[2]) * t) * k,
  ];
}

// ===== world/sky.js =====


// Near-black navy dome, a sparse handful of dim stars and a small faint moon.
// No city glow, no buildings.

function createSky({ radius = 450 } = {}) {
  const group = new THREE.Group();
  group.name = 'NightSky';

  const dome = new THREE.Mesh(
    new THREE.SphereGeometry(radius, 32, 16),
    new THREE.ShaderMaterial({
      side: THREE.BackSide,
      depthWrite: false,
      fog: false,
      uniforms: {
        uTop: { value: new THREE.Color(PALETTE.skyTop) },
        uHorizon: { value: new THREE.Color(PALETTE.skyHorizon) },
        uBottom: { value: new THREE.Color(PALETTE.skyBottom) },
      },
      vertexShader: /* glsl */ `
        varying vec3 vDir;
        void main() {
          vDir = normalize( position );
          gl_Position = projectionMatrix * modelViewMatrix * vec4( position, 1.0 );
        }`,
      fragmentShader: /* glsl */ `
        uniform vec3 uTop; uniform vec3 uHorizon; uniform vec3 uBottom;
        varying vec3 vDir;
        void main() {
          float h = normalize( vDir ).y;
          vec3 col = mix( uHorizon, uTop, smoothstep( 0.0, 0.55, h ) );
          col = mix( col, uBottom, smoothstep( 0.0, -0.15, h ) );
          float n = fract( sin( dot( gl_FragCoord.xy, vec2( 12.9898, 78.233 ) ) ) * 43758.5453 );
          col += ( n - 0.5 ) * 0.0015; // dither to avoid banding in the dark gradient
          gl_FragColor = vec4( col, 1.0 );
        }`,
    })
  );
  dome.renderOrder = -10;
  group.add(dome);

  // --- sparse stars ---------------------------------------------------------
  const rng = mulberry32(77);
  const STAR_COUNT = 160;
  const pos = [], size = [], phase = [], bright = [];
  const r = radius * 0.92;
  while (size.length < STAR_COUNT) {
    const u = rng() * 2 - 1, th = rng() * Math.PI * 2;
    const s = Math.sqrt(1 - u * u);
    const d = [s * Math.cos(th), u, s * Math.sin(th)];
    if (d[1] < 0.14) continue; // only above the treeline
    pos.push(d[0] * r, d[1] * r, d[2] * r);
    size.push(1.0 + rng() * 1.4);
    phase.push(rng());
    bright.push(0.12 + Math.pow(rng(), 3) * 0.45);
  }
  const starGeo = new THREE.BufferGeometry();
  starGeo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  starGeo.setAttribute('aSize', new THREE.Float32BufferAttribute(size, 1));
  starGeo.setAttribute('aPhase', new THREE.Float32BufferAttribute(phase, 1));
  starGeo.setAttribute('aBright', new THREE.Float32BufferAttribute(bright, 1));
  const starMat = new THREE.ShaderMaterial({
    uniforms: { uTime: { value: 0 }, uPixelRatio: { value: 1 } },
    transparent: true,
    depthWrite: false,
    blending: THREE.AdditiveBlending,
    fog: false,
    vertexShader: /* glsl */ `
      uniform float uTime; uniform float uPixelRatio;
      attribute float aSize; attribute float aPhase; attribute float aBright;
      varying float vB;
      void main() {
        gl_Position = projectionMatrix * modelViewMatrix * vec4( position, 1.0 );
        gl_PointSize = aSize * uPixelRatio;
        vB = aBright * ( 0.75 + 0.25 * sin( uTime * ( 0.5 + aPhase ) + aPhase * 20.0 ) );
      }`,
    fragmentShader: /* glsl */ `
      varying float vB;
      void main() {
        float r = length( gl_PointCoord - 0.5 ) * 2.0;
        float a = smoothstep( 1.0, 0.0, r );
        gl_FragColor = vec4( vec3( 0.75, 0.82, 1.0 ) * vB, a );
      }`,
  });
  const stars = new THREE.Points(starGeo, starMat);
  stars.frustumCulled = false;
  group.add(stars);

  // --- small faint moon -----------------------------------------------------
  const moonDir = new THREE.Vector3(...MOON_DIR).normalize();
  const moon = new THREE.Mesh(
    new THREE.PlaneGeometry(1, 1),
    new THREE.ShaderMaterial({
      transparent: true,
      depthWrite: false,
      blending: THREE.AdditiveBlending,
      fog: false,
      vertexShader: /* glsl */ `
        varying vec2 vUv;
        void main() { vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4( position, 1.0 ); }`,
      fragmentShader: /* glsl */ `
        varying vec2 vUv;
        void main() {
          float r = length( vUv - 0.5 ) * 2.0;
          float disc = smoothstep( 0.2, 0.18, r );
          float halo = exp( - r * 5.0 ) * 0.12;
          vec3 col = vec3( 0.52, 0.58, 0.7 ) * disc * 0.55 + vec3( 0.25, 0.32, 0.5 ) * halo;
          gl_FragColor = vec4( col, 1.0 );
        }`,
    })
  );
  moon.position.copy(moonDir).multiplyScalar(radius * 0.85);
  moon.scale.setScalar(34);
  moon.lookAt(0, 0, 0);
  group.add(moon);

  return {
    group,
    moonDir,
    update(t) {
      starMat.uniforms.uTime.value = t;
    },
    setPixelRatio(pr) {
      starMat.uniforms.uPixelRatio.value = pr;
    },
  };
}

// ===== world/firTree.js =====

// Low-poly snow-laden fir built from stacked cones. Geometries are unit-sized
// and shared; each tier is one instance in an InstancedMesh, so the whole
// forest costs only a few draw calls.

const SEGMENTS = 14;

/** Foliage tier: unit cone, base at y=0, jagged drooping lower edge. */
function createFoliageGeometry() {
  const g = new THREE.ConeGeometry(1, 1, SEGMENTS, 2, false);
  g.translate(0, 0.5, 0);
  const p = g.attributes.position;
  for (let i = 0; i < p.count; i++) {
    const x = p.getX(i), y = p.getY(i), z = p.getZ(i);
    const rad = Math.hypot(x, z);
    if (rad < 1e-4) continue;
    const a = Math.atan2(z, x);
    // ConeGeometry places segment j at theta = j/SEGMENTS·2π with x = sin, z = cos
    let theta = Math.atan2(x, z);
    if (theta < 0) theta += Math.PI * 2;
    const k = (Math.round((theta / (Math.PI * 2)) * SEGMENTS) % SEGMENTS) % 2;
    if (y < 0.01) {
      const s = k ? 1.0 : 0.8;
      p.setXYZ(i, x * s, k ? -0.06 : 0.05, z * s);
    } else if (y < 0.9) {
      const s = 1 + 0.05 * Math.sin(a * 5.0);
      p.setXYZ(i, x * s, y, z * s);
    }
  }
  g.computeVertexNormals();
  return g;
}

/** Snow cap: unit cone with a soft wavy, drooping rim. */
function createSnowCapGeometry() {
  const g = new THREE.ConeGeometry(1, 1, SEGMENTS, 1, false);
  g.translate(0, 0.5, 0);
  const p = g.attributes.position;
  for (let i = 0; i < p.count; i++) {
    const x = p.getX(i), y = p.getY(i), z = p.getZ(i);
    if (y > 0.01 || Math.hypot(x, z) < 1e-4) continue;
    const a = Math.atan2(z, x);
    const s = 1 + 0.06 * Math.sin(a * 7 + 1);
    p.setXYZ(i, x * s, 0.08 * Math.sin(a * 7) - 0.05, z * s);
  }
  g.computeVertexNormals();
  return g;
}

function createTrunkGeometry() {
  const g = new THREE.CylinderGeometry(0.55, 0.75, 1, 8, 1, true);
  g.translate(0, 0.5, 0);
  return g;
}

/**
 * Describe a fir as tiers. Returns tiers (foliage) + caps (snow) in local
 * space (base at y=0) and an envelope(y) radius function used to wrap lights.
 */
function describeFir({ height, radius, tiers, capCover = 0.58 }) {
  const trunkH = height * 0.1;
  const span = height - trunkH;
  const list = [];
  const caps = [];
  for (let i = 0; i < tiers; i++) {
    const t = tiers > 1 ? i / (tiers - 1) : 0;
    const r = radius * (1 - t * 0.82);
    const h = span * (0.42 - t * 0.12);
    const yBase = trunkH + t * (span - h);
    list.push({ yBase, h, r });
    const capH = h * capCover;
    caps.push({ yBase: yBase + h * (1 - capCover) + h * 0.02, h: capH, r: r * (capCover + 0.06) });
  }
  const cones = list.concat(caps);
  const envelope = (y) => {
    let best = 0;
    for (const c of cones) {
      if (y < c.yBase || y > c.yBase + c.h) continue;
      best = Math.max(best, c.r * (1 - (y - c.yBase) / c.h));
    }
    return best;
  };
  return { height, radius, trunkH, tiers: list, caps, envelope };
}

/**
 * Wrap a fir with string lights: several spiral strands plus scattered bulbs.
 * Calls emit(x, y, z) in the tree's local space.
 */
function wrapLights(desc, count, rng, emit, { strands = 3, turns = 7, offset = 0.12, scatter = 0.3 } = {}) {
  const top = desc.height * 0.985;
  const minY = desc.trunkH + 0.1;
  let placed = 0, guard = 0;
  while (placed < count && guard++ < count * 40) {
    const y = minY + rng() * (top - minY);
    const env = desc.envelope(y);
    if (env <= 0.05) continue;
    if (rng() > env / desc.radius + 0.06) continue; // density ∝ surface area
    let a;
    if (rng() > scatter) {
      const s = placed % strands;
      a = (s / strands) * Math.PI * 2 + (y / desc.height) * turns * Math.PI * 2 + (rng() - 0.5) * 0.25;
    } else {
      a = rng() * Math.PI * 2;
    }
    const r = env + offset + rng() * 0.06;
    emit(Math.cos(a) * r, y, Math.sin(a) * r);
    placed++;
  }
  return placed;
}

/** Push instance matrices for one tree into the given instanced arrays. */
function pushFirInstances(desc, position, rotY, out) {
  const m = new THREE.Matrix4();
  const q = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 1, 0), rotY);
  const s = new THREE.Vector3();
  const p = new THREE.Vector3();
  for (const t of desc.tiers) {
    p.set(position.x, position.y + t.yBase, position.z);
    out.foliage.push(m.compose(p, q, s.set(t.r, t.h, t.r)).clone());
  }
  for (const c of desc.caps) {
    p.set(position.x, position.y + c.yBase, position.z);
    out.caps.push(m.compose(p, q, s.set(c.r, c.h, c.r)).clone());
  }
  p.set(position.x, position.y - 0.2, position.z);
  const tr = desc.radius * 0.12;
  out.trunks.push(m.compose(p, q, s.set(tr, desc.trunkH + 0.6, tr)).clone());
}

function toInstancedMesh(geometry, material, matrices, name) {
  const mesh = new THREE.InstancedMesh(geometry, material, matrices.length);
  matrices.forEach((mx, i) => mesh.setMatrixAt(i, mx));
  mesh.instanceMatrix.needsUpdate = true;
  mesh.computeBoundingSphere();
  mesh.name = name;
  return mesh;
}

// ===== world/ground.js =====


// Snowfield: flat around the rink, gently rolling further out, plus snow
// drifts banked against the rink boards and around tree bases.

function heightAt(x, z) {
  const e = Math.sqrt((x / RINK.rx) ** 2 + (z / RINK.rz) ** 2);
  const t = THREE.MathUtils.smoothstep(e, 1.15, 2.3);
  const h = Math.sin(x * 0.08) * Math.cos(z * 0.07) + Math.sin(x * 0.031 + z * 0.043) * 1.4 + 1.2;
  return t * Math.max(0, h) * 0.9;
}

function createGround({ glow }) {
  const group = new THREE.Group();
  group.name = 'Snowfield';

  const geo = new THREE.PlaneGeometry(340, 340, 96, 96);
  geo.rotateX(-Math.PI / 2);
  const p = geo.attributes.position;
  for (let i = 0; i < p.count; i++) p.setY(i, heightAt(p.getX(i), p.getZ(i)));
  geo.computeVertexNormals();

  const snowMat = glow.patch(new THREE.MeshStandardMaterial({ color: PALETTE.snow, roughness: 0.95 }), 1);
  const ground = new THREE.Mesh(geo, snowMat);
  ground.name = 'SnowGround';
  group.add(ground);

  function addDrifts(treePlacements) {
    const rng = mulberry32(31);
    const mats = [];
    const m = new THREE.Matrix4(), q = new THREE.Quaternion(), s = new THREE.Vector3(), v = new THREE.Vector3();
    const up = new THREE.Vector3(0, 1, 0);
    const outer = RINK.boardThickness;

    // banked snow along the outside of the boards
    const N = 64;
    for (let i = 0; i < N; i++) {
      const a = (i / N) * Math.PI * 2 + rng() * 0.05;
      const off = outer + 0.6 + rng() * 1.2;
      const x = (RINK.rx + off) * Math.cos(a);
      const z = (RINK.rz + off) * Math.sin(a);
      // align the drift's long (local x) axis with the ellipse tangent
      const tangent = Math.atan2(-RINK.rz * Math.cos(a), -RINK.rx * Math.sin(a));
      q.setFromAxisAngle(up, tangent);
      v.set(x, -0.12, z);
      s.set(2.2 + rng() * 1.6, 0.55 + rng() * 0.4, 1.1 + rng() * 0.8);
      mats.push(m.compose(v, q, s).clone());
    }
    // mounds hugging tree bases
    for (const t of treePlacements) {
      for (let k = 0; k < 2; k++) {
        const a = rng() * Math.PI * 2;
        const r = t.radius * (0.55 + rng() * 0.3);
        v.set(t.position.x + Math.cos(a) * r, t.position.y - 0.1, t.position.z + Math.sin(a) * r);
        q.setFromAxisAngle(up, rng() * Math.PI);
        s.set(1.6 + rng() * 1.6, 0.5 + rng() * 0.5, 1.2 + rng() * 1.2);
        mats.push(m.compose(v, q, s).clone());
      }
    }

    const driftGeo = new THREE.SphereGeometry(1, 14, 7, 0, Math.PI * 2, 0, Math.PI / 2);
    const drifts = new THREE.InstancedMesh(driftGeo, snowMat, mats.length);
    mats.forEach((mx, i) => drifts.setMatrixAt(i, mx));
    drifts.instanceMatrix.needsUpdate = true;
    drifts.computeBoundingSphere();
    drifts.name = 'SnowDrifts';
    group.add(drifts);
  }

  return { group, addDrifts, material: snowMat };
}

// ===== world/iceRink.js =====




// Elliptical ice rink. The ice is a planar Reflector with a custom shader:
//  - real mirror reflection of the tree / forest lights (slightly blurred & rippled)
//  - cool blue base tint, frost toward the boards
//  - a warm pool of light that fades from the centre outward (not a flat brightening)

const IceShader = {
  name: 'WinterIceShader',
  uniforms: {
    color: { value: null },
    tDiffuse: { value: null },
    textureMatrix: { value: null },
    uRadii: { value: new THREE.Vector2(RINK.rx, RINK.rz) },
    uWarm: { value: new THREE.Color(1.0, 0.42, 0.12) },
    uDeep: { value: new THREE.Color(PALETTE.iceDeep) },
    uFrost: { value: new THREE.Color(PALETTE.iceFrost) },
    uReflectStrength: { value: 0.85 },
    uGlowStrength: { value: 0.8 },
    uBlur: { value: 0.0025 },
  },
  vertexShader: /* glsl */ `
    uniform mat4 textureMatrix;
    varying vec4 vUvProj;
    varying vec2 vLocal;
    varying vec3 vWorld;
    #include <common>
    #include <logdepthbuf_pars_vertex>
    void main() {
      vUvProj = textureMatrix * vec4( position, 1.0 );
      vLocal = position.xy;
      vec4 wp = modelMatrix * vec4( position, 1.0 );
      vWorld = wp.xyz;
      gl_Position = projectionMatrix * viewMatrix * wp;
      #include <logdepthbuf_vertex>
    }`,
  fragmentShader: /* glsl */ `
    uniform vec3 color;
    uniform sampler2D tDiffuse;
    uniform vec2 uRadii;
    uniform vec3 uWarm;
    uniform vec3 uDeep;
    uniform vec3 uFrost;
    uniform float uReflectStrength;
    uniform float uGlowStrength;
    uniform float uBlur;
    varying vec4 vUvProj;
    varying vec2 vLocal;
    varying vec3 vWorld;
    #include <logdepthbuf_pars_fragment>

    float hash( vec2 p ) { return fract( sin( dot( p, vec2( 127.1, 311.7 ) ) ) * 43758.5453 ); }
    float noise( vec2 p ) {
      vec2 i = floor( p ), f = fract( p );
      f = f * f * ( 3.0 - 2.0 * f );
      return mix( mix( hash( i ), hash( i + vec2( 1.0, 0.0 ) ), f.x ),
                  mix( hash( i + vec2( 0.0, 1.0 ) ), hash( i + vec2( 1.0, 1.0 ) ), f.x ), f.y );
    }
    float fbm( vec2 p ) {
      float v = 0.0, a = 0.5;
      for ( int i = 0; i < 4; i ++ ) { v += a * noise( p ); p *= 2.03; a *= 0.5; }
      return v;
    }

    void main() {
      #include <logdepthbuf_fragment>
      float d = length( vLocal / uRadii );          // 0 = centre, 1 = boards
      float n = fbm( vLocal * 0.35 );

      // rippled, slightly blurred mirror reflection
      vec2 offs = ( vec2( fbm( vLocal * 0.6 ), fbm( vLocal * 0.6 + 17.3 ) ) - 0.5 ) * 0.012;
      vec4 uv = vUvProj;
      uv.xy += offs * uv.w;
      float b = uBlur * uv.w;
      vec3 refl = texture2DProj( tDiffuse, uv ).rgb * 0.4;
      refl += texture2DProj( tDiffuse, uv + vec4(  b, 0.0, 0.0, 0.0 ) ).rgb * 0.15;
      refl += texture2DProj( tDiffuse, uv + vec4( -b, 0.0, 0.0, 0.0 ) ).rgb * 0.15;
      refl += texture2DProj( tDiffuse, uv + vec4( 0.0,  b, 0.0, 0.0 ) ).rgb * 0.15;
      refl += texture2DProj( tDiffuse, uv + vec4( 0.0, -b, 0.0, 0.0 ) ).rgb * 0.15;

      vec3 V = normalize( cameraPosition - vWorld );
      float cosT = clamp( V.y, 0.0, 1.0 );
      float fres = 0.04 + 0.96 * pow( 1.0 - cosT, 5.0 );
      float reflAmt = uReflectStrength * mix( 0.35, 1.0, fres ) * ( 0.85 + 0.15 * n );

      vec3 base = uDeep * ( 0.7 + 0.6 * n );

      // warm light spreading softly from the tree outwards
      float glow = exp( - pow( d * 2.2, 1.6 ) ) * 0.55 + exp( - d * 5.0 ) * 0.4;
      vec3 warm = uWarm * glow * uGlowStrength * ( 0.9 + 0.2 * n );

      // skate-scuffed frost near the boards
      float frost = smoothstep( 0.82, 1.0, d ) * ( 0.5 + 0.5 * n );
      float streak = noise( vec2( vLocal.x * 0.15 + vLocal.y * 2.4, vLocal.y * 0.15 ) );

      vec3 col = base + warm;
      col = mix( col, uFrost * ( 0.35 + 0.3 * n ), frost * 0.6 );
      col += refl * reflAmt * vec3( 0.82, 0.92, 1.05 ) * ( 1.0 - frost * 0.5 );
      col += vec3( 0.02, 0.035, 0.06 ) * streak * ( 1.0 - frost );
      col += vec3( 0.03, 0.05, 0.09 ) * fres;       // cool sky sheen at grazing angles

      gl_FragColor = vec4( col, 1.0 );
      #include <tonemapping_fragment>
      #include <colorspace_fragment>
    }`,
};

function createIceRink({ renderer, glow, bulbs, reflectionScale = 0.5 }) {
  const group = new THREE.Group();
  group.name = 'IceRink';

  // --- ice ------------------------------------------------------------------
  const shape = new THREE.Shape();
  shape.absellipse(0, 0, RINK.rx, RINK.rz, 0, Math.PI * 2, false, 0);
  const iceGeo = new THREE.ShapeGeometry(shape, 96);

  const size = renderer.getDrawingBufferSize(new THREE.Vector2());
  const ice = new Reflector(iceGeo, {
    clipBias: 0.003,
    textureWidth: Math.max(256, Math.floor(size.x * reflectionScale)),
    textureHeight: Math.max(256, Math.floor(size.y * reflectionScale)),
    color: 0xffffff,
    shader: IceShader,
    multisample: 0,
  });
  ice.rotation.x = -Math.PI / 2;
  ice.position.y = RINK.iceY;
  ice.name = 'Ice';
  group.add(ice);

  // --- boards ---------------------------------------------------------------
  const t = RINK.boardThickness;
  const ring = new THREE.Shape();
  ring.absellipse(0, 0, RINK.rx + t, RINK.rz + t, 0, Math.PI * 2, false, 0);
  const hole = new THREE.Path();
  hole.absellipse(0, 0, RINK.rx, RINK.rz, 0, Math.PI * 2, true, 0);
  ring.holes.push(hole);
  const boardGeo = new THREE.ExtrudeGeometry(ring, { depth: RINK.boardHeight, bevelEnabled: false, curveSegments: 96 });
  boardGeo.rotateX(-Math.PI / 2);
  const boardMat = glow.patch(new THREE.MeshStandardMaterial({ color: PALETTE.boards, roughness: 0.55 }), 1);
  const boards = new THREE.Mesh(boardGeo, boardMat);
  boards.name = 'RinkBoards';
  group.add(boards);

  // --- warm string lights along the top rail --------------------------------
  const rng = mulberry32(9);
  const a = RINK.rx + t / 2, b = RINK.rz + t / 2;
  const perimeter = Math.PI * (3 * (a + b) - Math.sqrt((3 * a + b) * (a + 3 * b)));
  const count = Math.floor(perimeter / 0.55);
  for (let i = 0; i < count; i++) {
    const th = (i / count) * Math.PI * 2;
    const sag = 0.06 * Math.abs(Math.sin(i * 0.5 * Math.PI)); // tiny scallop between posts
    const c = warmBulbColor(rng, PALETTE, LIGHTING.bulbIntensity);
    bulbs.add(a * Math.cos(th), RINK.boardHeight + 0.1 - sag, b * Math.sin(th), 0.2, c[0] * 0.8, c[1] * 0.8, c[2] * 0.8);
  }

  return {
    group,
    ice,
    setSize(w, h) {
      ice.getRenderTarget().setSize(Math.max(256, Math.floor(w * reflectionScale)), Math.max(256, Math.floor(h * reflectionScale)));
    },
  };
}

// ===== world/christmasTree.js =====




// The visual heart of the scene: a huge, full tree in the middle of the ice,
// wrapped in ~1700 warm bulbs, a glowing star, on a small snow island.

function createChristmasTree({ glow, bulbs }) {
  const rng = mulberry32(1225);
  const group = new THREE.Group();
  group.name = 'ChristmasTree';

  const { height, radius, tiers } = CENTER_TREE;
  const base = new THREE.Vector3(0, RINK.iceY + 0.35, 0);
  const desc = describeFir({ height, radius, tiers, capCover: 0.34 });
  const out = { foliage: [], caps: [], trunks: [] };
  pushFirInstances(desc, base, 0.3, out);

  // Faint warm self-illumination so the tree reads as lit from within.
  const foliageMat = glow.patch(
    new THREE.MeshStandardMaterial({ color: PALETTE.foliageCenter, roughness: 0.85, emissive: 0x1c0a03, emissiveIntensity: 1 }),
    1.4
  );
  const snowMat = glow.patch(new THREE.MeshStandardMaterial({ color: PALETTE.snow, roughness: 0.85 }), 1);
  const trunkMat = new THREE.MeshStandardMaterial({ color: PALETTE.trunk, roughness: 1 });
  group.add(toInstancedMesh(createFoliageGeometry(), foliageMat, out.foliage, 'TreeFoliage'));
  group.add(toInstancedMesh(createSnowCapGeometry(), snowMat, out.caps, 'TreeSnow'));
  group.add(toInstancedMesh(createTrunkGeometry(), trunkMat, out.trunks, 'TreeTrunk'));

  // ~1700 small bulbs on four spiral strands + scatter
  wrapLights(desc, CENTER_TREE.bulbs, rng, (x, y, z) => {
    const c = warmBulbColor(rng, PALETTE, LIGHTING.bulbIntensity);
    bulbs.add(x, base.y + y, z, 0.24, c[0], c[1], c[2]);
  }, { strands: 4, turns: 9, offset: 0.14, scatter: 0.4 });

  // a few larger amber "lantern" glows tucked into the branches for depth
  wrapLights(desc, 70, rng, (x, y, z) => {
    bulbs.add(x * 0.97, base.y + y, z * 0.97, 0.75, 1.3, 0.62, 0.22);
  }, { strands: 1, turns: 3, offset: 0.05, scatter: 1 });

  // --- star -------------------------------------------------------------------
  const shape = new THREE.Shape();
  for (let i = 0; i < 10; i++) {
    const a = (i / 10) * Math.PI * 2 + Math.PI / 2;
    const r = i % 2 === 0 ? 1.15 : 0.47;
    if (i === 0) shape.moveTo(Math.cos(a) * r, Math.sin(a) * r);
    else shape.lineTo(Math.cos(a) * r, Math.sin(a) * r);
  }
  shape.closePath();
  const starGeo = new THREE.ExtrudeGeometry(shape, { depth: 0.3, bevelEnabled: true, bevelSize: 0.06, bevelThickness: 0.06, bevelSegments: 1 });
  starGeo.center();
  const star = new THREE.Mesh(starGeo, new THREE.MeshBasicMaterial({ color: new THREE.Color(4.5, 2.6, 1.0), fog: false }));
  star.position.set(0, base.y + height + 0.9, 0);
  group.add(star);
  bulbs.add(0, star.position.y, 0, 4.2, 1.6, 0.85, 0.35); // soft halo around the star

  // --- snow island the tree stands on ----------------------------------------
  const island = new THREE.Mesh(
    new THREE.SphereGeometry(1, 28, 8, 0, Math.PI * 2, 0, Math.PI / 2),
    snowMat
  );
  island.scale.set(ISLAND_RADIUS, 0.85, ISLAND_RADIUS);
  island.position.y = RINK.iceY - 0.05;
  island.name = 'SnowIsland';
  group.add(island);

  // warm bounce from the bulbs onto the tree's own snow & island
  glow.add(0, 2.5, 0, 8.5, 0.32);
  glow.add(0, 8.0, 0, 6.5, 0.26);
  glow.add(0, 13.5, 0, 4.5, 0.22);

  return {
    group,
    star,
    update(t) {
      star.rotation.y = t * 0.35;
    },
  };
}

// ===== world/forest.js =====




// 22 snow-covered firs in a loose ring around the rink, with the arc in
// front of the camera left open so the rink and central tree read clearly.

function createForest({ glow, bulbs, heightAt }) {
  const rng = mulberry32(FOREST.seed);
  const group = new THREE.Group();
  group.name = 'WinterForest';

  const [gapA, gapB] = FOREST.frontGapDeg.map(THREE.MathUtils.degToRad);
  const arcStart = gapB;
  const arcLen = Math.PI * 2 - (gapB - gapA);

  const placements = [];
  const out = { foliage: [], caps: [], trunks: [] };

  for (let i = 0; i < FOREST.count; i++) {
    const theta = arcStart + ((i + 0.5) / FOREST.count) * arcLen + (rng() - 0.5) * 0.12;
    const back = Math.max(0, -Math.sin(theta)); // 1 = behind the central tree
    const height = 7.5 + rng() * 3.5 + back * 4.5 + (i % 3 === 0 ? 2 : 0);
    const radius = height * (0.34 + rng() * 0.06);
    const n = new THREE.Vector2(Math.cos(theta) / RINK.rx, Math.sin(theta) / RINK.rz).normalize();
    const d = radius + 2.2 + rng() * 10 + back * 5;
    const x = (RINK.rx + 0.4) * Math.cos(theta) + n.x * d;
    const z = (RINK.rz + 0.4) * Math.sin(theta) + n.y * d;
    const position = new THREE.Vector3(x, heightAt(x, z) - 0.1, z);
    const rotY = rng() * Math.PI * 2;
    const tiers = height > 11 ? 5 : 4;
    const desc = describeFir({ height, radius, tiers, capCover: 0.6 });

    pushFirInstances(desc, position, rotY, out);
    placements.push({ position, height, radius, theta });

    // dense warm string lights wound around the branches
    const count = Math.round(1.25 * height * height);
    const cos = Math.cos(rotY), sin = Math.sin(rotY);
    wrapLights(desc, count, rng, (lx, ly, lz) => {
      const c = warmBulbColor(rng, PALETTE, LIGHTING.bulbIntensity);
      bulbs.add(position.x + lx * cos - lz * sin, position.y + ly, position.z + lx * sin + lz * cos, 0.2, c[0], c[1], c[2]);
    }, { strands: 2, turns: 4 + height * 0.25, offset: 0.1, scatter: 0.35 });

    // soft bounce of those bulbs onto the tree's own snow and the ground
    glow.add(position.x, position.y + height * 0.32, position.z, height * 0.6, 0.14);
  }

  const foliageMat = glow.patch(new THREE.MeshStandardMaterial({ color: PALETTE.foliage, roughness: 0.9 }), 1);
  const snowMat = glow.patch(new THREE.MeshStandardMaterial({ color: PALETTE.snow, roughness: 0.85 }), 1);
  const trunkMat = new THREE.MeshStandardMaterial({ color: PALETTE.trunk, roughness: 1 });

  group.add(toInstancedMesh(createFoliageGeometry(), foliageMat, out.foliage, 'ForestFoliage'));
  group.add(toInstancedMesh(createSnowCapGeometry(), snowMat, out.caps, 'ForestSnow'));
  group.add(toInstancedMesh(createTrunkGeometry(), trunkMat, out.trunks, 'ForestTrunks'));

  return { group, placements };
}

// ===== world/lights.js =====


// Only 7 real point lights in the whole scene (+ hemisphere + moon).
// Thousands of bulbs are emissive sprites; these lights just carry their
// combined warmth onto snow, boards and branches.

function createLights({ moonDir }) {
  const group = new THREE.Group();
  group.name = 'Lighting';

  const { hemi, moon, treeRing, treeTop, forest } = LIGHTING;

  // cold, dim ambient from the night sky
  group.add(new THREE.HemisphereLight(hemi.sky, hemi.ground, hemi.intensity));

  // faint cool moonlight for rim / shape on snow
  const moonLight = new THREE.DirectionalLight(moon.color, moon.intensity);
  moonLight.position.copy(moonDir).multiplyScalar(100).setY(60);
  group.add(moonLight);

  // warm lights around the central tree (outside the foliage so they light its surface)
  const pointLights = [];
  for (let i = 0; i < treeRing.count; i++) {
    const a = (i / treeRing.count) * Math.PI * 2 + Math.PI / 2;
    const l = new THREE.PointLight(PALETTE.warmLight, treeRing.intensity, treeRing.distance, treeRing.decay);
    l.position.set(Math.cos(a) * treeRing.radius, treeRing.y, Math.sin(a) * treeRing.radius);
    group.add(l);
    pointLights.push(l);
  }
  const top = new THREE.PointLight(0xffa155, treeTop.intensity, treeTop.distance, treeTop.decay);
  top.position.set(0, treeTop.y, treeTop.z);
  group.add(top);
  pointLights.push(top);

  // warm pools inside the forest ring, nudged toward the rink so they light
  // the faces of the trees that the camera sees
  for (const deg of forest.anglesDeg) {
    const a = THREE.MathUtils.degToRad(deg);
    const l = new THREE.PointLight(PALETTE.warmLight, forest.intensity, forest.distance, forest.decay);
    l.position.set((RINK.rx + forest.offset) * Math.cos(a), forest.y, (RINK.rz + forest.offset) * Math.sin(a));
    group.add(l);
    pointLights.push(l);
  }

  const base = pointLights.map((l) => l.intensity);
  return {
    group,
    pointLights,
    // very slight candle-like breathing so the light feels alive
    update(t) {
      pointLights.forEach((l, i) => {
        l.intensity = base[i] * (0.94 + 0.04 * Math.sin(t * 1.7 + i * 2.1) + 0.02 * Math.sin(t * 4.3 + i));
      });
    },
  };
}

// ===== world/snowfall.js =====


// Gentle falling snow, animated entirely on the GPU (one draw call).

function createSnowfall({ count = 1400, area = 140, height = 40 } = {}) {
  const rng = mulberry32(5);
  const pos = new Float32Array(count * 3);
  const phase = new Float32Array(count);
  const speed = new Float32Array(count);
  for (let i = 0; i < count; i++) {
    pos[i * 3] = (rng() - 0.5) * area;
    pos[i * 3 + 1] = rng() * height;
    pos[i * 3 + 2] = (rng() - 0.5) * area;
    phase[i] = rng() * Math.PI * 2;
    speed[i] = 0.6 + rng() * 0.9;
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  geo.setAttribute('aPhase', new THREE.BufferAttribute(phase, 1));
  geo.setAttribute('aSpeed', new THREE.BufferAttribute(speed, 1));

  const mat = new THREE.ShaderMaterial({
    uniforms: { uTime: { value: 0 }, uHeight: { value: height }, uViewportH: { value: 1080 } },
    transparent: true,
    depthWrite: false,
    blending: THREE.AdditiveBlending,
    fog: false,
    vertexShader: /* glsl */ `
      uniform float uTime; uniform float uHeight; uniform float uViewportH;
      attribute float aPhase; attribute float aSpeed;
      varying float vA;
      void main() {
        vec3 p = position;
        p.y = mod( p.y - uTime * aSpeed, uHeight );
        p.x += sin( uTime * 0.3 + aPhase ) * 1.2;
        p.z += cos( uTime * 0.23 + aPhase * 1.7 ) * 0.8;
        vec4 mv = modelViewMatrix * vec4( p, 1.0 );
        gl_Position = projectionMatrix * mv;
        float dist = max( - mv.z, 0.1 );
        gl_PointSize = clamp( 0.14 * uViewportH * projectionMatrix[ 1 ][ 1 ] * 0.5 / dist, 1.0, 10.0 );
        vA = 0.32 * exp( - pow( dist * 0.012, 2.0 ) ) * smoothstep( 0.0, 2.0, p.y );
      }`,
    fragmentShader: /* glsl */ `
      varying float vA;
      void main() {
        float r = length( gl_PointCoord - 0.5 ) * 2.0;
        float a = smoothstep( 1.0, 0.2, r ) * vA;
        gl_FragColor = vec4( vec3( 0.78, 0.84, 0.95 ) * a, 1.0 );
      }`,
  });
  const points = new THREE.Points(geo, mat);
  points.frustumCulled = false;
  points.name = 'Snowfall';

  return {
    points,
    update(t) {
      mat.uniforms.uTime.value = t;
    },
    setViewportHeight(h) {
      mat.uniforms.uViewportH.value = h;
    },
  };
}

// ===== world/index.js =====











/**
 * Magical Winter Forest Ice Rink — background + lighting only.
 * Characters, movement and input are NOT touched by this module.
 *
 *   const world = createWinterWorld({ scene, renderer });
 *   // in your loop:   world.update(elapsedSeconds);
 *   // on resize:      world.setSize(drawingBufferWidth, drawingBufferHeight, pixelRatio);
 */
function createWinterWorld({ scene, renderer }) {
  scene.background = new THREE.Color(PALETTE.fog);
  scene.fog = new THREE.FogExp2(PALETTE.fog, PALETTE.fogDensity);

  const root = new THREE.Group();
  root.name = 'WinterForestIceRink';
  scene.add(root);

  const glow = createWarmGlow();
  const bulbs = new BulbField();

  const sky = createSky();
  const ground = createGround({ glow });
  const rink = createIceRink({ renderer, glow, bulbs });
  const tree = createChristmasTree({ glow, bulbs });
  const forest = createForest({ glow, bulbs, heightAt });
  ground.addDrifts(forest.placements);
  const lights = createLights({ moonDir: sky.moonDir });
  const bulbPoints = bulbs.build();
  const snow = createSnowfall();

  root.add(sky.group, ground.group, rink.group, tree.group, forest.group, lights.group, bulbPoints, snow.points);

  function setSize(w, h, pixelRatio = 1) {
    bulbs.material.uniforms.uViewportH.value = h;
    snow.setViewportHeight(h);
    sky.setPixelRatio(pixelRatio);
    rink.setSize(w, h);
  }
  const buf = renderer.getDrawingBufferSize(new THREE.Vector2());
  setSize(buf.x, buf.y, renderer.getPixelRatio());

  return {
    root,
    stats: { bulbs: bulbs.count, trees: forest.placements.length + 1, pointLights: lights.pointLights.length },
    // handy for whatever controls the character: walkable ice area
    bounds: { rx: RINK.rx, rz: RINK.rz, iceY: RINK.iceY, islandRadius: ISLAND_RADIUS },
    update(t) {
      bulbs.material.uniforms.uTime.value = t;
      glow.uniforms.uGlowFlicker.value = 0.96 + 0.04 * Math.sin(t * 2.3);
      sky.update(t);
      tree.update(t);
      lights.update(t);
      snow.update(t);
    },
    setSize,
  };
}

// ===== camera/followCamera.js =====
// Third-person follow camera: ~3 m behind and ~1.7 m above the skater.
// Yaw follows the skater's heading with smoothing (no snapping on sharp turns
// or sudden stops); position and look-at point are also eased.

class FollowCamera {
  constructor(camera, { distance = 3.0, height = 1.7, lookHeight = 1.15, lookAhead = 1.6 } = {}) {
    this.camera = camera;
    this.distance = distance;
    this.height = height;
    this.lookHeight = lookHeight;
    this.lookAhead = lookAhead;
    this.yaw = null;
    // user orbit + zoom (defaults reproduce exactly 3 m behind / 1.7 m above)
    this.orbitYaw = 0;
    this.pitch = Math.atan2(height, distance);
    this.radius = Math.hypot(height, distance);
    this.targetRadius = this.radius;
    this.minPitch = THREE.MathUtils.degToRad(5);
    this.maxPitch = THREE.MathUtils.degToRad(65);
    this.minRadius = 1.8;
    this.maxRadius = 9;
    this.pos = new THREE.Vector3();
    this.look = new THREE.Vector3();
    this._p = new THREE.Vector3();
    this._l = new THREE.Vector3();
    camera.fov = 55;
    camera.near = 0.05;
    camera.far = 1200;
    camera.updateProjectionMatrix();
  }

  rotate(dYaw, dPitch) {
    this.orbitYaw += dYaw;
    this.pitch = THREE.MathUtils.clamp(this.pitch + dPitch, this.minPitch, this.maxPitch);
  }

  zoom(factor) {
    this.targetRadius = THREE.MathUtils.clamp(this.targetRadius * factor, this.minRadius, this.maxRadius);
  }

  _targets(target, followYaw) {
    const yaw = followYaw + this.orbitYaw;
    const fx = Math.sin(yaw), fz = Math.cos(yaw);
    const back = this.radius * Math.cos(this.pitch), up = this.radius * Math.sin(this.pitch);
    this._p.set(target.x - fx * back, Math.max(target.y + up, 0.35), target.z - fz * back);
    // keep the camera out of the central tree / snow island
    const r = Math.hypot(this._p.x, this._p.z), minR = 6.9;
    if (r < minR) { const k = minR / Math.max(r, 1e-3); this._p.x *= k; this._p.z *= k; }
    this._l.set(target.x + fx * this.lookAhead, target.y + this.lookHeight, target.z + fz * this.lookAhead);
  }

  update(dt, target, heading) {
    if (this.yaw === null) {
      this.yaw = heading;
      this._targets(target, this.yaw);
      this.pos.copy(this._p);
      this.look.copy(this._l);
    }
    // shortest-angle eased yaw
    let d = heading - this.yaw;
    d = Math.atan2(Math.sin(d), Math.cos(d));
    this.yaw += d * (1 - Math.exp(-dt * 2.6));
    this.radius += (this.targetRadius - this.radius) * (1 - Math.exp(-dt * 8)); // smooth zoom
    this._targets(target, this.yaw);
    this.pos.lerp(this._p, 1 - Math.exp(-dt * 6.0));
    this.look.lerp(this._l, 1 - Math.exp(-dt * 8.0));
    this.camera.position.copy(this.pos);
    this.camera.lookAt(this.look);
  }
}

// ===== player/PlaceholderPlayer.js =====
// Clay-figure skater (reference: smooth minimal 3D figure — big round head, one-piece
// side-swept brown hair, slim long limbs) wearing a white hoodie, black pants and white
// skates. Same jointed rig as before (shoulders, elbows, hips, knees, ankles); sleeves and
// trouser legs are skinned tubes that bend with those joints, so no joint seams show.
// Movement / WASD / arrow-key controls are unchanged.

function clayMat(color, roughness = 0.78) {
  return new THREE.MeshStandardMaterial({ color, roughness, metalness: 0 });
}

function buildSkater() {
  // ---------- materials: soft matte clay skin, fabric with fine grain ----------
  const grain = (() => {                                   // tiny procedural knit grain for the fabrics
    const n = 128, d = new Uint8Array(n * n * 4);
    for (let i = 0; i < n * n; i++) { const v = 110 + Math.random() * 90; d.set([v, v, v, 255], i * 4); }
    const t = new THREE.DataTexture(d, n, n);
    t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(10, 10); t.needsUpdate = true;
    return t;
  })();
  const C = {
    skin: new THREE.MeshStandardMaterial({ color: 0xf2d0c0, roughness: 0.9, metalness: 0 }),
    hair: new THREE.MeshStandardMaterial({ color: 0x593724, roughness: 0.93, metalness: 0 }),
    hoodie: new THREE.MeshPhysicalMaterial({ color: 0xefedf0, roughness: 0.95, sheen: 0.7, sheenRoughness: 0.75, sheenColor: 0xffffff, bumpMap: grain, bumpScale: 0.3 }),
    pants: new THREE.MeshPhysicalMaterial({ color: 0x27272b, roughness: 0.97, sheen: 0.4, sheenRoughness: 0.8, sheenColor: 0x6a6a78, bumpMap: grain, bumpScale: 0.3 }),
    boot: new THREE.MeshStandardMaterial({ color: 0xf5f5f7, roughness: 0.62, metalness: 0 }),
    blade: new THREE.MeshStandardMaterial({ color: 0xc6ccd4, roughness: 0.3, metalness: 0.85 }),
    eye: new THREE.MeshStandardMaterial({ color: 0x17110f, roughness: 0.22 }),
    cord: new THREE.MeshStandardMaterial({ color: 0xe6e4e8, roughness: 0.9, metalness: 0 }),
  };
  const sm01 = (a, b, x) => { const t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t * t * (3 - 2 * t); };
  // upper body −10% (waist → neck 0.49 → 0.441): only the chest band between the pocket (y 0.1) and the
  // shoulders (y 0.3) is shortened; pocket and hem stay put, shoulders / hood / collar / neck move down unchanged
  const TY = (y) => y - 0.049 * sm01(0.1, 0.3, y);

  // joint layout — IDENTICAL to the previous rig so every animation keeps working
  // arms −10% (upper 0.25 → 0.225, fore 0.23 → 0.207); legs unchanged
  const L = { thigh: 0.36, shin: 0.34, foot: 0.13, upper: 0.225, fore: 0.207 };
  const root = new THREE.Group();      // on the ice, yaw
  const body = new THREE.Group();      // roll / bob
  const pelvis = new THREE.Group();
  root.add(body);
  body.add(pelvis);
  const torso = new THREE.Group();
  torso.position.y = 0.04;
  pelvis.add(torso);
  const neck = new THREE.Group();
  neck.position.y = 0.401;            // = TY(0.45)
  torso.add(neck);
  const head = new THREE.Group();
  head.position.y = 0.26;
  neck.add(head);

  // ---------- head: big round head, thick layered side-swept hair, small low face, round ears ----------
  // (the head group's joint position is unchanged; the larger head is lifted inside it so it sits on the hood)
  const HR = 0.26;
  const face = new THREE.Group();
  face.position.y = 0.035;
  face.scale.set(1.04, 0.97, 0.98);
  head.add(face);
  face.add(new THREE.Mesh(new THREE.SphereGeometry(HR, 96, 64), C.skin));
  {
    // hair = the head sphere pushed out where hair grows (a single mass, no stuck-on pieces):
    // low side-swept fringe with rounded lock tips, full volume on top and sides, tapered nape
    const g = new THREE.SphereGeometry(HR, 220, 150);
    const p = g.attributes.position, d = new THREE.Vector3();
    for (let i = 0; i < p.count; i++) {
      d.fromBufferAttribute(p, i).normalize();
      const lon = Math.atan2(d.x, d.z);                          // 0 = front
      const al = Math.abs(lon), front = 1 - sm01(0.75, 1.2, al), back = sm01(1.5, 2.15, al);
      // chunky locks: rounded tips with small V notches between them (more, smaller locks on the fringe)
      const tipsF = 1 - Math.abs(Math.sin(lon * 7 + 0.9)), tipsS = 1 - Math.abs(Math.sin(lon * 6 + 0.4));
      const tips = tipsF * front + tipsS * (1 - front);
      const burn = Math.exp(-(((Math.abs(lon) - 1.12) / 0.2) ** 2));   // side locks falling in front of the ears
      const cutFront = 0.0 + 0.2 * d.x + 0.11 * (1 - tips) ** 2;     // long fringe sweeping lower toward one side
      const cutSide = 0.03 - 0.18 * burn + 0.06 * (1 - tips) ** 1.5;
      const cutBack = -0.68 + 0.06 * (1 - tips) ** 1.5;
      const cut = (cutSide + (cutBack - cutSide) * back) * (1 - front) + cutFront * front;
      const above = d.y - cut;
      const cover = sm01(-0.018, 0.03, above);
      const hug = 0.3 + 0.7 * sm01(0.0, 0.32, above);                 // lock ends curl in toward the head
      const groove = -0.009 * Math.abs(Math.cos(lon * 9 + d.y * 3.5 + 0.5 * Math.sin(lon * 3))) ** 8 * sm01(-0.2, 0.5, d.y);
      const thick = (0.03 + 0.03 * sm01(-0.3, 0.85, d.y) + 0.008 * front) * hug + groove;
      const r = HR * 0.975 + cover * (HR * 0.025 + thick);
      p.setXYZ(i, d.x * r, d.y * r, d.z * r);
    }
    g.computeVertexNormals();
    face.add(new THREE.Mesh(g, C.hair));
  }
  // ears: small flattened round ears at eye level, partly under the hair
  for (const sx of [-1, 1]) {
    const ear = new THREE.Mesh(new THREE.SphereGeometry(0.058, 40, 28), C.skin);
    ear.scale.set(0.62, 1.0, 0.85);
    ear.position.set(sx * HR * 1.0, -0.05, -0.025);
    face.add(ear);
  }
  const onFace = (x, y, z, k = 1.0) => new THREE.Vector3(x, y, z).normalize().multiplyScalar(HR * k);
  const facing = (m, v) => m.quaternion.setFromUnitVectors(new THREE.Vector3(0, 0, 1), v.clone().normalize());
  for (const sx of [-1, 1]) {                                 // small glossy oval eyes, set low and wide
    const eye = new THREE.Mesh(new THREE.SphereGeometry(0.019, 32, 24), C.eye);
    eye.scale.set(0.9, 1.25, 0.5);
    eye.position.copy(onFace(0.34 * sx, -0.17, 0.92, 0.997));
    facing(eye, eye.position);
    face.add(eye);
  }
  const nose = new THREE.Mesh(new THREE.SphereGeometry(0.012, 20, 14), C.skin);   // barely-there nose (reads in profile)
  nose.scale.set(1, 0.8, 0.75);
  nose.position.copy(onFace(0, -0.27, 0.96, 0.997));
  face.add(nose);
  {                                                           // small soft smile
    const A = Math.PI * 0.62, sg = new THREE.TorusGeometry(0.021, 0.0042, 12, 40, A);
    sg.rotateZ(-Math.PI / 2 - A / 2);
    const smile = new THREE.Mesh(sg, C.eye);
    const at = onFace(0, -0.36, 0.93, 0.996);
    facing(smile, at);
    smile.position.copy(at).add(new THREE.Vector3(0, 0.021, 0).applyQuaternion(smile.quaternion));
    face.add(smile);
  }
  const neckSkin = new THREE.Mesh(new THREE.CylinderGeometry(0.055, 0.062, 0.12, 20), C.skin);
  neckSkin.position.y = 0.02;
  neck.add(neckSkin);

  // ---------- hoodie body: one soft rounded shell, long enough to cover the hips, ribbed hem band ----------
  const prof = (pts) => pts.map(([r, y]) => new THREE.Vector2(r, y));
  const HB = { sx: 1.13, sz: 0.85 };
  const hoodieBody = new THREE.Mesh(new THREE.LatheGeometry(prof([
    [0.19, -0.152], [0.203, -0.166], [0.216, -0.161], [0.222, -0.142], [0.221, -0.12], [0.215, -0.111],
    [0.217, -0.1], [0.221, -0.06], [0.219, 0.04], [0.219, 0.16], [0.221, 0.25], [0.214, 0.315],
    [0.199, 0.37], [0.176, 0.41], [0.146, 0.442], [0.113, 0.466], [0.09, 0.481], [0.078, 0.495],
    [0.068, 0.5], [0.06, 0.492],
  ].map(([r, y]) => [r, TY(y)])), 96), C.hoodie);
  hoodieBody.scale.set(HB.sx, 1, HB.sz);
  torso.add(hoodieBody);
  // ---------- folded hood: a thick soft roll around the neck (V at the front) + the hood lying folded on the back ----------
  {
    const A = Math.PI * 1.4, R = 0.13, pts = [];
    for (let k = 0; k <= 32; k++) {
      const th = Math.PI / 2 - A / 2 + (A * k) / 32, z = -R * Math.sin(th);
      pts.push(new THREE.Vector3(1.16 * R * Math.cos(th), -0.075 * Math.max(0, z / R) ** 1.3, z));
    }
    const curve = new THREE.CatmullRomCurve3(pts);
    const TS = 140, RS = 32, rim = new THREE.TubeGeometry(curve, TS, 0.056, RS, false), rp = rim.attributes.position, c = new THREE.Vector3();
    for (let j = 0; j <= TS; j++) {
      const u = j / TS, k = 0.2 + 0.8 * sm01(0, 0.3, u) * sm01(1, 0.7, u);
      curve.getPointAt(u, c);
      for (let i = 0; i <= RS; i++) {
        const n = j * (RS + 1) + i;
        rp.setXYZ(n, c.x + (rp.getX(n) - c.x) * k, c.y + (rp.getY(n) - c.y) * k, c.z + (rp.getZ(n) - c.z) * k);
      }
    }
    rim.computeVertexNormals();
    const hoodRim = new THREE.Mesh(rim, C.hoodie);
    hoodRim.position.set(0, TY(0.458), -0.018); hoodRim.rotation.x = 0.16;   // back sits higher than the front
    torso.add(hoodRim);
    const hg = new THREE.SphereGeometry(1, 72, 48), hp = hg.attributes.position;   // the hood itself, folded on the upper back:
    for (let i = 0; i < hp.count; i++) {                                         // a soft teardrop narrowing to a rounded point
      const y = hp.getY(i), lo = Math.max(0, -y);
      hp.setXYZ(i, hp.getX(i) * (1 - 0.45 * lo * lo), y * (1 + 0.35 * lo), hp.getZ(i) * (1 - 0.25 * lo));
    }
    hg.computeVertexNormals();
    const back = new THREE.Mesh(hg, C.hoodie);
    back.scale.set(0.215, 0.14, 0.088); back.position.set(0, TY(0.38), -0.165); back.rotation.x = 0.3;
    torso.add(back);
  }
  // ---------- kangaroo pocket: a large puffy trapezoid pad with slanted openings, wrapped on the belly ----------
  {
    const g = new THREE.SphereGeometry(1, 96, 48), p = g.attributes.position;
    const spow = (v, e) => Math.sign(v) * Math.abs(v) ** e;
    const a = 0.219 * HB.sx, b = 0.219 * HB.sz;
    for (let i = 0; i < p.count; i++) {
      let x = spow(p.getX(i), 0.38), y = spow(p.getY(i), 0.38), z = p.getZ(i);
      x *= 0.178 * (1 - 0.24 * (y + 1) / 2); y *= 0.088; z *= 0.034;
      z += b * Math.sqrt(Math.max(0, 1 - (x / a) ** 2)) - b;
      p.setXYZ(i, x, y, z);
    }
    g.computeVertexNormals();
    const pocket = new THREE.Mesh(g, C.hoodie);
    pocket.position.set(0, 0.0, b + 0.004);
    torso.add(pocket);
  }
  // drawstrings: thick soft cords from the hood opening down the chest, with knotted ends
  for (const sx of [-1, 1]) {
    const x = 0.042 * sx;
    const cc = new THREE.CatmullRomCurve3([
      new THREE.Vector3(x, TY(0.452), 0.118), new THREE.Vector3(x * 1.05, TY(0.39), 0.172), new THREE.Vector3(x * 1.1, TY(0.27), 0.19),
    ]);
    torso.add(new THREE.Mesh(new THREE.TubeGeometry(cc, 40, 0.0085, 14, false), C.cord));
    const knot = new THREE.Mesh(new THREE.SphereGeometry(0.016, 24, 16), C.cord);
    knot.scale.set(1, 1.25, 1); knot.position.set(x * 1.1, TY(0.262), 0.192);
    torso.add(knot);
  }

  // ---------- pants waist (separate garment) ----------
  const waist = new THREE.Mesh(new THREE.LatheGeometry(prof([
    [0.0, -0.165], [0.07, -0.16], [0.14, -0.13], [0.17, -0.07], [0.176, 0.0], [0.172, 0.06], [0.166, 0.085],
  ]), 36), C.pants);
  waist.scale.set(1.12, 1, 0.92);
  pelvis.add(waist);

  // ---------- smooth limbs: one skinned tube per sleeve / trouser leg / boot shaft ----------
  // Bones sit inside the existing joint groups, so the tubes bend with the same
  // shoulder/elbow and hip/knee/ankle rotations the animations already drive.
  // The top of each sleeve / trouser leg is a round dome centred exactly on the joint
  // pivot and bound only to that joint, so it stays a perfect ball however far the
  // joint turns (round shoulders and hips that never pinch or twist).
  const HAND_R = 0.088;
  const limbs = [];
  // surface of revolution from [y, r] samples (top → bottom); normals come from the
  // profile itself so the dome poles and rolled hems shade smoothly
  const tube = (samples, radial) => {
    const pos = [], nor = [], uv = [], ys = [], idx = [], n = samples.length;
    for (let j = 0; j < n; j++) {
      const [y, r] = samples[j];
      const [ya, ra] = samples[Math.max(0, j - 1)], [yb, rb] = samples[Math.min(n - 1, j + 1)];
      let nr = -(yb - ya), ny = rb - ra; const nl = Math.hypot(nr, ny) || 1; nr /= nl; ny /= nl;
      for (let i = 0; i < radial; i++) {
        const a = (i / radial) * Math.PI * 2, ca = Math.cos(a), sa = Math.sin(a);
        pos.push(ca * r, y, sa * r); nor.push(ca * nr, ny, sa * nr); uv.push(i / radial, j / (n - 1)); ys.push(y);
      }
    }
    for (let j = 0; j < n - 1; j++) for (let i = 0; i < radial; i++) {
      const a = j * radial + i, b = j * radial + ((i + 1) % radial), c = a + radial, d = b + radial;
      idx.push(a, b, c, b, d, c);              // outward-facing
    }
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
    g.setAttribute('normal', new THREE.Float32BufferAttribute(nor, 3));
    g.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
    g.setIndex(idx);
    return { g, ys };
  };
  const dome = (R, steps = 20) => {                         // hemisphere cap centred on the joint pivot
    const s = [];
    for (let k = 0; k <= steps; k++) { const t = (Math.PI / 2) * (1 - k / steps); s.push([R * Math.sin(t), Math.max(R * Math.cos(t), 1e-4)]); }
    return s;
  };
  // frame: joint group the samples are written in; joints: bone parents; weights(y) → one weight per joint
  const skinLimb = (frame, joints, samples, weights, mat) => {
    const bones = joints.map((j) => { const b = new THREE.Bone(); j.add(b); return b; });
    const { g, ys } = tube(samples, 48);
    const si = [], sw = [];
    for (const y of ys) {
      const w = weights(y), s = w.reduce((a, b) => a + b, 0);
      for (let k = 0; k < 4; k++) { si.push(k < w.length ? k : 0); sw.push(k < w.length ? w[k] / s : 0); }
    }
    g.setAttribute('skinIndex', new THREE.Uint16BufferAttribute(si, 4));
    g.setAttribute('skinWeight', new THREE.Float32BufferAttribute(sw, 4));
    const mesh = new THREE.SkinnedMesh(g, mat);
    mesh.frustumCulled = false;
    limbs.push({ mesh, frame, bones });
    root.add(mesh);
  };

  const arm = (side) => {
    const shoulder = new THREE.Group();
    shoulder.position.set(0.25 * side, 0.311, 0);   // = TY(0.36)
    torso.add(shoulder);
    const elbow = new THREE.Group();
    elbow.position.y = -L.upper;
    shoulder.add(elbow);
    // sleeve: round shoulder ball → one even, plump thickness all the way → ribbed cuff band → soft rolled edge
    skinLimb(shoulder, [shoulder, elbow], [
      ...dome(0.095),
      [-0.027, 0.094], [-0.072, 0.09], [-0.117, 0.088], [-0.225, 0.088], [-0.324, 0.087], [-0.3735, 0.086],
      [-0.3852, 0.081], [-0.396, 0.08], [-0.4095, 0.079], [-0.4176, 0.074], [-0.4221, 0.066], [-0.4203, 0.058],
    ], (y) => { const f = sm01(-0.1755, -0.2745, y); return [1 - f, f]; }, C.hoodie);
    // elbow filler: a ball on the pivot keeps the bend full instead of pinching
    elbow.add(new THREE.Mesh(new THREE.SphereGeometry(0.085, 32, 24), C.hoodie));
    // hand: one big smooth ball coming out of the cuff (no fingers, no thumb) — same size as the ears
    const hand = new THREE.Group();
    hand.position.y = -L.fore;
    elbow.add(hand);
    const palm = new THREE.Mesh(new THREE.SphereGeometry(HAND_R, 48, 36), C.skin);
    palm.position.y = -0.05;
    hand.add(palm);
    return { shoulder, elbow };
  };
  const leg = (side) => {
    const hip = new THREE.Group();
    hip.position.set(0.1 * side, -0.02, 0);
    pelvis.add(hip);
    const knee = new THREE.Group();
    knee.position.y = -L.thigh;
    hip.add(knee);
    const ankle = new THREE.Group();
    ankle.position.y = -L.shin;
    knee.add(ankle);
    // trouser leg and boot shaft share ONE weight curve (hip → knee → ankle), so the
    // shaft always bends exactly like the trouser hem around it and can never poke out
    const legW = (y) => {
      const f = sm01(-0.31, -0.41, y), a = sm01(-0.46, -0.62, y);
      return [1 - f, f * (1 - a), a];
    };
    // trouser leg: round hip ball → relaxed leg → slightly wider soft hem resting on the boot
    skinLimb(hip, [hip, knee, ankle], [
      ...dome(0.108),
      [-0.05, 0.108], [-0.15, 0.106], [-0.3, 0.104], [-0.36, 0.103], [-0.42, 0.106], [-0.48, 0.111],
      [-0.53, 0.116], [-0.552, 0.118], [-0.563, 0.115], [-0.569, 0.11], [-0.567, 0.105],
    ], legW, C.pants);
    // knee filler (same idea as the elbow)
    knee.add(new THREE.Mesh(new THREE.SphereGeometry(0.099, 32, 24), C.pants));
    // skate: high-top round boot — shaft visible under the trouser hem, round toe cap — on a silver
    // blade holder with two windows and a curved runner + toe pick (runner bottom = same ice contact height)
    skinLimb(hip, [hip, knee, ankle], [
      [-0.48, 0.0005], [-0.481, 0.045], [-0.486, 0.07], [-0.494, 0.086], [-0.505, 0.095], [-0.517, 0.099],
      [-0.6, 0.1], [-0.66, 0.1], [-0.7, 0.097], [-0.73, 0.085], [-0.75, 0.06], [-0.758, 0.0005],
    ], legW, C.boot);
    const boot = new THREE.Mesh(new THREE.CapsuleGeometry(0.093, 0.12, 16, 40), C.boot);
    boot.rotation.x = Math.PI / 2; boot.scale.set(1, 1, 0.92); boot.position.set(0, 0.012, 0.045);
    ankle.add(boot);
    {
      const B = -L.foot;                                       // blade runner bottom (on the ice)
      const o = [[-0.15, B + 0.012], [-0.14, B + 0.002], [-0.12, B], [0.14, B], [0.17, B + 0.004], [0.19, B + 0.014],
        [0.2, B + 0.028], [0.192, B + 0.036], [0.165, B + 0.03], [0.13, -0.06], [-0.09, -0.06], [-0.13, B + 0.03], [-0.148, B + 0.024]];
      const sh = new THREE.Shape(o.map(([z, y]) => new THREE.Vector2(z, y)));
      const win = (z0, z1, y0, y1, r) => {
        const h = new THREE.Path();
        h.moveTo(z0 + r, y0); h.lineTo(z1 - r, y0); h.quadraticCurveTo(z1, y0, z1, y0 + r); h.lineTo(z1, y1 - r);
        h.quadraticCurveTo(z1, y1, z1 - r, y1); h.lineTo(z0 + r, y1); h.quadraticCurveTo(z0, y1, z0, y1 - r); h.lineTo(z0, y0 + r);
        h.quadraticCurveTo(z0, y0, z0 + r, y0);
        return h;
      };
      sh.holes.push(win(-0.075, -0.012, B + 0.014, -0.074, 0.01), win(0.012, 0.085, B + 0.014, -0.074, 0.01));
      const hg = new THREE.ExtrudeGeometry(sh, { depth: 0.012, bevelEnabled: true, bevelThickness: 0.003, bevelSize: 0.0025, bevelSegments: 3, curveSegments: 10 });
      hg.translate(0, 0, -0.006); hg.rotateY(-Math.PI / 2);   // profile drawn in (z, y); thickness along x
      ankle.add(new THREE.Mesh(hg, C.blade));
    }
    return { hip, knee, ankle };
  };

  const rig = {
    root, body, pelvis, torso, neck, head,
    armL: arm(1), armR: arm(-1),   // facing +z, so the left side is +x
    legL: leg(1), legR: leg(-1),
    L,
  };

  // bind every tube in the rest pose: geometry is moved from its joint frame into
  // the mesh's space, then the skeleton records the rest transforms
  root.updateMatrixWorld(true);
  for (const { mesh, frame, bones } of limbs) {
    const m = new THREE.Matrix4().copy(mesh.matrixWorld).invert().multiply(frame.matrixWorld);
    mesh.geometry.applyMatrix4(m);                       // (normals move with it)
    mesh.bind(new THREE.Skeleton(bones));
  }
  root.traverse((o) => { if (o.isMesh) o.castShadow = false; });
  return rig;
}

const lerp = (a, b, t) => a + (b - a) * t;

class PlaceholderPlayer {
  constructor(scene, bounds) {
    this.bounds = bounds;
    this.velocity = new THREE.Vector3();
    this.keys = new Set();

    this.rig = buildSkater();
    this.mesh = this.rig.root;
    this.mesh.position.set(0, bounds.iceY, bounds.rz * 0.7);
    this.heading = Math.PI;              // start facing the central tree
    this.mesh.rotation.y = this.heading;
    this.phase = 0;
    this.glide = 0;                      // 0 = idle … 1 = skating
    this.roll = 0;
    this.time = 0;
    this.target = null;                  // tap / click destination on the ice
    this.trick = null;                   // running jump animation (Triple Axel)
    this.glideOut = false;               // extended coast after landing
    this._best = Infinity;
    this._stuck = 0;
    scene.add(this.mesh);

    addEventListener('keydown', (e) => this.keys.add(e.code));
    addEventListener('keyup', (e) => this.keys.delete(e.code));
  }

  get position() {
    return this.mesh.position;
  }

  update(dt) {
    const k = this.keys;
    const ix = (k.has('KeyD') || k.has('ArrowRight') ? 1 : 0) - (k.has('KeyA') || k.has('ArrowLeft') ? 1 : 0);
    const iz = (k.has('KeyS') || k.has('ArrowDown') ? 1 : 0) - (k.has('KeyW') || k.has('ArrowUp') ? 1 : 0);
    const v = this.velocity;
    if (ix || iz) this.target = null;   // keyboard always wins
    if (this.target) this._steerToTarget(dt);
    // holding a key builds the push up smoothly: 14 (as before) → 36 m/s² over ~1.2 s
    this._hold = (ix || iz) ? Math.min(1.2, (this._hold || 0) + dt) : 0;
    const hk = this._hold / 1.2, build = hk * hk * (3 - 2 * hk);
    const push = this.trick ? 14 : 14 + 22 * build;     // Triple Axel keeps its original handling
    v.x += ix * push * dt;
    v.z += iz * push * dt;
    if (!this.target || this.trick) v.multiplyScalar(Math.exp(-1.2 * dt)); // icy glide (tap-steering controls its own speed)
    if (this.glideOut) {                    // post-landing coast: speed eases out smoothly to a stop
      const G = this.glideOutState;
      G.t += dt;
      if (ix || iz || this.target || G.t >= G.time) this.glideOut = false;
      else {
        const sp = G.v0 * (1 - G.t / G.time) ** G.p;
        if (v.lengthSq() > 1e-6) v.setLength(sp);   // keep direction (slides along the boards if it meets them)
      }
    }
    const vmax = this.trick ? 9 : 27;      // top speed ×3 (unchanged while jumping)
    if (!this.glideOut && v.length() > vmax) v.setLength(vmax);

    const p = this.mesh.position;
    p.addScaledVector(v, dt);

    // stay on the ice, off the island
    const { rx, rz, islandRadius } = this.bounds;
    const e = Math.hypot(p.x / (rx - 0.8), p.z / (rz - 0.8));
    if (e > 1) {
      p.x /= e; p.z /= e;
      const n = new THREE.Vector3(p.x / (rx * rx), 0, p.z / (rz * rz)).normalize();
      v.addScaledVector(n, -Math.max(0, v.dot(n)) * 1.6);
    }
    const r = Math.hypot(p.x, p.z), minR = islandRadius + 0.8;
    if (r < minR) {
      const n = new THREE.Vector3(p.x, 0, p.z).normalize();
      p.x = n.x * minR; p.z = n.z * minR;
      v.addScaledVector(n, -Math.min(0, v.dot(n)) * 1.6);
    }

    // smooth turning toward the direction of travel (no snapping)
    const speed = v.length();
    let turn = 0;
    if (speed > 0.15) {
      let d = Math.atan2(v.x, v.z) - this.heading;
      d = Math.atan2(Math.sin(d), Math.cos(d));
      turn = d * (1 - Math.exp(-dt * 7));
      this.heading += turn;
    }
    this.mesh.rotation.y = this.heading;
    this._animate(dt, speed, turn / Math.max(dt, 1e-3));
    if (this.trick) this._applyTrick(dt);
  }

  // ---- Triple Axel (≈3 s): prep 0.5 s → air + 1080° spin 1.5 s → landing 1 s ----
  startTripleAxel(onEnd) {
    if (this.trick) return false;
    const v = this.velocity;
    if (v.length() > 9) v.setLength(9);    // enter the jump at the original speed range so it plays exactly as before
    if (v.length() < 1.0) v.set(Math.sin(this.heading), 0, Math.cos(this.heading)).multiplyScalar(1.0); // gentle creep into the prep
    this.trick = { t: 0, onEnd };
    return true;
  }

  _applyTrick(dt) {
    const T = this.trick;
    const PREP = 0.1, AIR = 1.5, END = 2.2;   // prep 0.1 s · air 1.5 s · landing 0.6 s (animation time)
    const EASE = 0.3;                          // peak speed-up in the middle (1 + EASE)
    const CROUCH = 0.4, CUSHION = 0.3, CUSHION_AT = 1.65;   // new separate phases (real seconds)
    T.hold1 = T.hold1 || 0; T.hold2 = T.hold2 || 0;
    if (!T.crouchDone && T.t >= PREP - 1e-6) {                        // compress & gather power, then spring
      T.hold1 += dt; if (T.hold1 >= CROUCH) T.crouchDone = true;
    } else if (!T.cushionDone && T.t >= CUSHION_AT) {                 // absorb the landing
      T.hold2 += dt; if (T.hold2 >= CUSHION) T.cushionDone = true;
      const slow = 1 - 0.7 * Math.sin(Math.PI * Math.min(1, T.hold2 / CUSHION)); // smooth 1 → 0.3 → 1, never a full stop
      T.t += dt * slow * (1 + EASE * Math.sin((Math.PI * Math.min(T.t, END)) / END) ** 2);
    } else {
      T.t += dt * (1 + EASE * Math.sin((Math.PI * Math.min(T.t, END)) / END) ** 2);
      if (!T.crouchDone) T.t = Math.min(T.t, PREP - 1e-6);
      else if (!T.cushionDone) T.t = Math.min(T.t, CUSHION_AT);
    }
    const t = T.t;
    const pc = Math.min(1, T.hold1 / CROUCH), pl = Math.min(1, T.hold2 / CUSHION);
    const R = this.rig;
    const clamp01 = (x) => Math.min(1, Math.max(0, x));
    const sm = (a, b, x) => { const u = clamp01((x - a) / (b - a)); return u * u * (3 - 2 * u); };
    const mix = (obj, key, target, w) => { obj[key] = lerp(obj[key], target, w); };

    // weights
    const wCross = sm(0.01, 0.1, t) * (1 - sm(1.6, 1.85, t));       // arms crossed: prep → air
    const wCrouch = T.crouchDone ? 0 : sm(0, 0.7, pc) * (1 - sm(0.82, 1, pc)); // 0.4 s: compress → drive up
    const wAir = sm(0.1, 0.2, t) * (1 - sm(1.55, 1.65, t));           // tight air position
    const wLand = sm(1.55, 1.65, t) * (1 - sm(1.9, 2.2, t));         // landing position
    const wOpen = sm(1.6, 1.85, t) * (1 - sm(1.95, 2.2, t));           // arms open on landing
    const absorb = T.cushionDone ? 0 : sm(0, 0.25, pl) * (1 - sm(0.35, 1, pl)); // 0.3 s: sink → rise

    // flight: height + exactly 3 turns about the vertical axis
    const u = clamp01((t - PREP) / AIR);
    const jumpY = 1.5 * (4 * u * (1 - u)) ** 2;                        // 0.46 m → 1.5 m (mid-spin) → 0.46 m
    const us = clamp01((u - 1 / 6) / (2 / 3));                         // 1.0 s window: same speed as before, one more turn
    const e = us * us * us * (us * (us * 6 - 15) + 10);                // fast in the middle
    const spin = Math.PI * 8 * e;                                      // exactly 1440° (4 turns)

    // ---- legs ----
    const setLeg = (leg, hx, hz, kn, w) => {
      mix(leg.hip.rotation, 'x', hx, w);
      mix(leg.hip.rotation, 'z', hz, w);
      mix(leg.knee.rotation, 'x', kn, w);
    };
    // take-off crouch on both legs
    setLeg(R.legL, -0.6, 0.03, 0.85, wCrouch);
    setLeg(R.legR, -0.6, -0.03, 0.85, wCrouch);
    // air: legs straight and together, right leg crossed slightly in front
    setLeg(R.legL, 0.06, -0.03, 0.06, wAir);
    setLeg(R.legR, -0.1, 0.03, 0.08, wAir);
    // landing: right leg supports and bends to absorb, left leg extends behind
    setLeg(R.legR, -0.35 - 0.25 * absorb, -0.04, 0.5 + 0.5 * absorb, wLand);
    setLeg(R.legL, 0.75, 0.14, 0.1, wLand);
    // knees only: load before take-off → snap straight on the push → cushion on touchdown
    const load = wCrouch;                                             // both knees bend deeper: gathering power
    const spring = sm(0.1, 0.15, t) * (1 - sm(0.17, 0.28, t));        // knees drive straight as she leaves the ice
    for (const leg of [R.legL, R.legR]) {
      mix(leg.knee.rotation, 'x', Math.PI / 2, load);            // 90° knee bend
      mix(leg.knee.rotation, 'x', 0.0, spring);
    }
    R.legL.knee.rotation.x += 0.3 * absorb * wLand;                    // free leg softens too (landing leg already bends)
    R.legR.knee.rotation.x += 0.12 * absorb * wLand;
    // follow-through: joints chase their target pose instead of jumping to it
    T.sm = T.sm || {};
    const kS = 1 - Math.exp(-dt * 18);
    const follow = (obj, key, id) => {
      if (T.sm[id] === undefined) T.sm[id] = obj[key];
      T.sm[id] += (obj[key] - T.sm[id]) * kS;
      obj[key] = T.sm[id];
    };
    for (const [n, leg] of [['L', R.legL], ['R', R.legR]]) {
      follow(leg.hip.rotation, 'x', 'hx' + n); follow(leg.hip.rotation, 'z', 'hz' + n); follow(leg.knee.rotation, 'x', 'kn' + n);
    }
    const point = 0.35 * Math.min(1, jumpY / 0.3) * wAir;              // pointed toes only when high enough
    for (const leg of [R.legL, R.legR]) {
      leg.ankle.rotation.x = -(leg.hip.rotation.x + leg.knee.rotation.x) + point;
      leg.ankle.rotation.z = -leg.hip.rotation.z * 0.6;
    }
    const L = R.L;
    const ext = (leg) => (L.thigh * Math.cos(leg.hip.rotation.x) + L.shin * Math.cos(leg.hip.rotation.x + leg.knee.rotation.x)) * Math.cos(leg.hip.rotation.z) + L.foot;
    R.pelvis.position.y = Math.max(ext(R.legL), ext(R.legR));
    mix(R.pelvis.position, 'x', 0, Math.max(wAir, wLand));

    // ---- torso / head ----
    const wBody = Math.max(wAir, wCrouch * 0.5);
    mix(R.torso.rotation, 'x', 0.02, wBody);
    mix(R.torso.rotation, 'y', 0, wBody);
    mix(R.torso.rotation, 'z', 0, wBody);
    mix(R.torso.rotation, 'x', 0.6, wCrouch * 0.9);                   // chest folds forward while compressing
    mix(R.torso.rotation, 'x', 0.22 + 0.15 * absorb, wLand);
    mix(R.torso.rotation, 'y', 0, wLand);
    mix(R.body.rotation, 'z', 0, Math.max(wAir, wLand));
    follow(R.torso.rotation, 'x', 'tx'); follow(R.torso.rotation, 'y', 'ty'); follow(R.torso.rotation, 'z', 'tz');
    follow(R.body.rotation, 'z', 'bz');
    R.neck.rotation.set(-R.torso.rotation.x * 0.7, -R.torso.rotation.y * 0.6, 0);

    // ---- arms: real shoulder/elbow joints form the X in front of the chest ----
    const setArm = (arm, x, y, z, el, w) => {
      mix(arm.shoulder.rotation, 'x', x, w);
      mix(arm.shoulder.rotation, 'y', y, w);
      mix(arm.shoulder.rotation, 'z', z, w);
      mix(arm.elbow.rotation, 'x', el, w);
    };
    setArm(R.armL, -1.6, -0.8, -0.6, -1.1, wCross);   // left forearm on top / in front
    setArm(R.armR, -1.5, 1.1, 0.7, -1.1, wCross);     // right forearm underneath
    setArm(R.armL, -0.25, 0, 1.25, -0.2, wOpen);
    setArm(R.armR, -0.25, 0, -1.25, -0.2, wOpen);
    for (const [n, arm] of [['L', R.armL], ['R', R.armR]]) {
      for (const k of ['x', 'y', 'z']) follow(arm.shoulder.rotation, k, 's' + k + n);
      follow(arm.elbow.rotation, 'x', 'e' + n);
    }

    // ---- forward travel: ~1 m from the take-off spot to the landing spot ----
    const pos = this.mesh.position, vel = this.velocity;
    if (t < PREP) {
      const hx = Math.sin(this.heading), hz = Math.cos(this.heading);
      vel.lerp(new THREE.Vector3(hx * 1.0, 0, hz * 1.0), 1 - Math.exp(-dt * 8)); // settle into the take-off (gradual)
    }
    if (t >= PREP && !T.takeoff) {
      T.takeoff = new THREE.Vector2(pos.x, pos.z);
      T.dir = new THREE.Vector2(Math.sin(this.heading), Math.cos(this.heading));
      T.saved = vel.clone();                                           // movement state to restore
      // longest clear path up to 16 m (stays on the ice, outside the island)
      const { rx, rz, islandRadius } = this.bounds;
      const okAt = (d) => {
        const x = T.takeoff.x + T.dir.x * d, z = T.takeoff.y + T.dir.y * d;
        return Math.hypot(x / (rx - 0.8), z / (rz - 0.8)) <= 1 && Math.hypot(x, z) >= islandRadius + 0.8;
      };
      T.dist = 0;
      for (let d = 0.1; d <= 16.0001; d += 0.1) { if (!okAt(d)) break; T.dist = d; }
    }
    if (T.takeoff && t < PREP + AIR) {
      const rate = (x) => 1 + EASE * Math.sin((Math.PI * Math.min(x, END)) / END) ** 2;
      const w0 = (1.0 * AIR) / 16 / rate(PREP);                       // take-off speed ≈ 1 m/s
      const w1 = 1 / rate(PREP + AIR);                                // touchdown speed = glide start speed
      const cFull = 3 * (1 - (w0 + w1) / 2);                           // extra speed concentrated in the spin
      const sa = 1 / 6, sL = 2 / 3, xs = Math.min(Math.max(u - sa, 0), sL);
      const B = w0 * sL + ((w1 - w0) * ((sa + sL) ** 2 - sa ** 2)) / 2; // base travel inside the spin window
      const c = Math.max(0, 3 * ((B + cFull / 3) / 2 - B));             // → spin-phase travel halved
      const S = w0 * u + ((w1 - w0) * u * u) / 2 + c * (xs / 2 - (sL / (4 * Math.PI)) * Math.sin((2 * Math.PI * xs) / sL));
      T.S1 = (w0 + w1) / 2 + c / 3;                                    // fraction of T.dist covered by touchdown
      // +0.5 m in the take-off posture (from leaving the ice to the start of the spin), eased in and out
      T.extra = Math.min(0.5, Math.max(0, T.dist * (1 - T.S1)));
      const ex = T.extra * sm(0, sa, u);
      pos.x = T.takeoff.x + T.dir.x * (T.dist * S + ex);               // continuous travel through the whole flight
      pos.z = T.takeoff.y + T.dir.y * (T.dist * S + ex);
    } else if (T.takeoff && !T.landed) {
      T.landed = true;
      pos.x = T.takeoff.x + T.dir.x * (T.dist * (T.S1 ?? 1) + (T.extra || 0)); // touch down at the end of the flight path
      pos.z = T.takeoff.y + T.dir.y * (T.dist * (T.S1 ?? 1) + (T.extra || 0));
      vel.set(T.dir.x, 0, T.dir.y).multiplyScalar(T.dist / AIR);          // carry the flight speed onto the ice
      this.glideOut = true;                                            // long coast after the landing
      const v0 = T.dist / AIR, GLIDE_DIST = 13.3, GLIDE_TIME = 5.45;   // 1.5 × 8.9 m
      this.glideOutState = { t: 0, v0, time: GLIDE_TIME, p: Math.max(1.2, (v0 * GLIDE_TIME) / GLIDE_DIST - 1) };
    }

    // ---- whole-body flight ----
    this.mesh.position.y = this.bounds.iceY + jumpY;
    this.mesh.rotation.y = this.heading + spin;

    if (t >= END) {
      // restore: on the ice, facing the travel direction, normal skating pose next frame
      this.mesh.position.y = this.bounds.iceY;
      this.mesh.rotation.y = this.heading;
      for (const arm of [R.armL, R.armR]) arm.shoulder.rotation.y = 0;
      this.trick = null;
      if (T.onEnd) T.onEnd();
    }
  }

  setTarget(x, z) {
    if (!this.target) this._acc = 1.5;     // each new trip starts with a soft push
    this.target = new THREE.Vector2(x, z);
    this._best = Infinity;
    this._stuck = 0;
  }

  _steerToTarget(dt) {
    const p = this.mesh.position, v = this.velocity;
    const dx = this.target.x - p.x, dz = this.target.y - p.z;
    const dist = Math.hypot(dx, dz);
    if (dist < 0.35) { this.target = null; return; }
    // give up if blocked (e.g. by the island or the boards)
    if (dist < this._best - 0.05) { this._best = dist; this._stuck = 0; }
    else if ((this._stuck += dt) > 1.5) { this.target = null; return; }
    // far taps skate faster and pick up speed harder; near taps stay gentle
    const want = Math.min(18, Math.sqrt(2 * 7 * dist) * 0.85, dist * 2.5);     // top 18 m/s (was 6), brakes in time
    const accTarget = THREE.MathUtils.clamp(1.5 + dist * 0.6, 1.5, 16);        // m/s², grows with distance
    this._acc = (this._acc ?? 1.5) + (accTarget - (this._acc ?? 1.5)) * (1 - Math.exp(-dt * 3)); // no sudden kick
    const tx = (dx / dist) * want - v.x, tz = (dz / dist) * want - v.z, dl = Math.hypot(tx, tz);
    const braking = want < Math.hypot(v.x, v.z);
    const step = (braking ? Math.max(this._acc, 9) : this._acc) * dt;
    const f = dl > step ? step / dl : 1;
    v.x += tx * f;
    v.z += tz * f;
  }

  _animate(dt, speed, yawRate) {
    const R = this.rig;
    this.time += dt;
    const t = this.time;
    const pushing = this.keys.size > 0 || (this.target !== null && speed < 5.5);
    const target = THREE.MathUtils.clamp(speed / 2.5, 0, 1);
    this.glide = lerp(this.glide, target, 1 - Math.exp(-dt * 4));
    const g = this.glide;
    // stroke rhythm: alternating pushes while moving, coasting when keys are released
    this.phase += dt * (2.4 + Math.min(speed, 12) * 0.22) * (pushing ? 1 : 0.35) * g;
    const s = Math.sin(this.phase);
    const pushL = Math.max(0, s) * (pushing ? 1 : 0.35);
    const pushR = Math.max(0, -s) * (pushing ? 1 : 0.35);
    const breathe = Math.sin(t * 1.8);
    const sway = Math.sin(t * 0.7);

    // ---- legs --------------------------------------------------------------
    const legPose = (leg, push, side) => {
      const support = 1 - push;
      const hx = lerp(-0.08 + 0.03 * sway * side, -0.32 * support + 0.55 * push, g);
      const hz = lerp(0.04, 0.06 + 0.38 * push, g) * side;
      const kn = lerp(0.14, 0.58 * support + 0.12 * push, g);
      leg.hip.rotation.set(hx, 0, hz);
      leg.knee.rotation.x = kn;
      leg.ankle.rotation.x = -(hx + kn) + 0.12 * push * g;  // keep the blade flat on the ice
      leg.ankle.rotation.z = -hz * 0.6;
      const L = R.L;
      return (L.thigh * Math.cos(hx) + L.shin * Math.cos(hx + kn)) * Math.cos(hz) + L.foot;
    };
    const hL = legPose(R.legL, pushL, 1);
    const hR = legPose(R.legR, pushR, -1);
    // the longer (supporting) leg stays on the ice; the pushing leg lifts slightly
    R.pelvis.position.y = Math.max(hL, hR) + 0.004 * breathe * (1 - g);
    R.pelvis.position.x = lerp(0.015 * sway, 0.05 * s, g);

    // ---- torso / head ------------------------------------------------------
    this.roll = lerp(this.roll, THREE.MathUtils.clamp(-yawRate * 0.12, -0.3, 0.3), 1 - Math.exp(-dt * 5));
    R.body.rotation.z = this.roll;
    R.torso.rotation.set(lerp(0.02, 0.38, g), lerp(0.04 * sway, -0.18 * s, g), lerp(0, -0.07 * s, g));
    R.torso.scale.setScalar(1 + 0.012 * breathe * (1 - g));
    R.neck.rotation.set(-R.torso.rotation.x * 0.7, -R.torso.rotation.y * 0.6, 0);
    R.head.rotation.z = lerp(0.04 * sway, 0, g);

    // ---- arms (balance) ----------------------------------------------------
    const armPose = (arm, side) => {
      const swing = -0.45 * s * side;                   // opposite to the pushing leg
      arm.shoulder.rotation.set(
